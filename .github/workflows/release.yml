name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  # Fails fast if the pushed tag doesn't match the workspace version (issue #317). Skipped on
  # workflow_dispatch, which has no real tag and only ever publishes a draft.
  version-check:
    name: Tag matches crate version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Check tag against workspace version
        if: github.event_name == 'push'
        run: .claude/hooks/check-release-version.sh "${GITHUB_REF_NAME}"

  # Build-only signal per platform before packaging, deliberately matching ci.yml's own
  # "build, test, clippy, fmt" -> build-only narrowing on this exact workspace: a real
  # `v0.0.1-test` tag run of a fuller `cargo test --workspace` step here hit the same
  # environment gaps ci.yml's own comments already document - the `lsp_*_wiring_tests`/
  # `vue_two_server_wiring_tests` modules each spin up a real rust-analyzer/pyright/
  # typescript-language-server/vue-language-server ("real X" is this workspace's own
  # naming convention for integration tests against the genuine external tool, not a
  # mock), none of which are installed on ubuntu-latest/macos-latest/windows-latest, so
  # every one of them failed with "the real <server> client never became Ready" rather
  # than a real product bug, plus ci.yml's own named `diff_render_tests` "known cache
  # flake". Installing four real language servers on three OSes to run the full suite
  # here is real, separate follow-up work, same as ci.yml's own comments already track
  # fuller CI as follow-up rather than something to take on inside this release
  # workflow.
  build:
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            artifact: jerry-linux.tar.gz
          - os: macos-latest
            name: macos
            artifact: Jerry-macos.dmg
          - os: windows-latest
            name: windows
            artifact: Jerry-windows.zip
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Linux system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            pkg-config \
            libfontconfig-dev \
            libvulkan1 \
            mesa-vulkan-drivers \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libasound2-dev

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2

      - name: cargo build --release -p app
        run: cargo build --release -p app

      # Each script assembles the real launchable bundle for its OS - a `.app` + DMG on
      # macOS, a tarball with a `.desktop` launcher entry on Linux, a zip carrying
      # `Jerry.exe` on Windows - and reads the release version from the workspace
      # `Cargo.toml` itself, so nothing here re-derives it. Invoked via `bash`/`pwsh`
      # rather than executed directly so a script's executable bit surviving checkout
      # isn't load-bearing.
      - name: Bundle (macOS)
        if: matrix.name == 'macos'
        shell: bash
        run: bash script/bundle-mac.sh

      - name: Bundle (Linux)
        if: matrix.name == 'linux'
        shell: bash
        run: bash script/bundle-linux.sh

      - name: Bundle (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: script/bundle-windows.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jerry-${{ matrix.name }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN is read-only unless a job explicitly asks for more (the
    # v0.0.1-test run failed here with "Resource not accessible by integration" against
    # this repo's own default token permissions) - scoped to just this job, the only one
    # that actually calls the Releases API, rather than widening the whole workflow's
    # token.
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # `workflow_dispatch` runs (no tag) publish a draft instead of a real release, so
      # manually testing this workflow never creates a public release out from under a
      # tag that doesn't exist.
      #
      # `generate_release_notes` asks GitHub itself (not this workflow) to diff merged
      # PRs against the previous published release and write a "What's Changed" body -
      # issue #92's ask, with zero new scripting since this repo's PR titles already
      # follow the `type(scope): summary` convention (see CONTRIBUTING.md) that reads
      # fine as a flat list without any PR-label categorization. On a `workflow_dispatch`
      # draft there's no real tag to diff from, so the generated notes may be rougher/
      # less precise - harmless, since that path is manual-testing-only (see `draft:`
      # above), never a public release.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
