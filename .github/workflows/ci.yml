name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  # Full verification on Linux: this is the platform this project is actually
  # developed on (see BUILD-LOG.md), and the one GitHub's own hosted runners can
  # exercise completely, including running the real test suite (GPUI's `test-support`
  # harness does not require a display server - see crates/app/Cargo.toml's
  # `gpui`/test-support comment; Zed's own CI runs `cargo test`/`cargo nextest` the
  # same way on plain Ubuntu runners, with no Xvfb or similar).
  linux:
    name: Linux (build, test, clippy, fmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # System libraries GPUI's Linux backend (both the `wayland` and `x11`
      # gpui_platform features are compiled in, Revision R12 - see that file's own
      # Cargo.toml comment, and `crate::gpui_linux`'s real `guess_compositor()`-based
      # runtime selection between them) needs to *compile*: Wayland client headers, X11/
      # xkbcommon headers, Vulkan (gpui_wgpu's renderer), and fontconfig (cosmic-text's
      # font matching). Trimmed down from the authoritative full list at
      # `vendor/zed/script/linux`'s Ubuntu/Debian branch, which also installs several
      # packages this project's own dependency set never touches (libgit2 - wt-core
      # uses `gix`, a pure-Rust reimplementation, never libgit2; musl-tools/musl-dev -
      # no musl target is built here; pipewire/xdg-desktop-portal/libva-dev - GPUI's
      # optional `screen-capture` feature, which nothing in this workspace enables).
      # ALSA, OpenSSL, sqlite3, and zstd dev packages were dropped from this list after
      # checking `Cargo.lock` directly: no `alsa`/`alsa-sys`, `openssl-sys`,
      # `libsqlite3-sys`/`rusqlite`, or `zstd-sys`/`libz-sys` appears anywhere in this
      # workspace's resolved dependency tree, so none of those four are actually needed
      # to build it, despite being genuinely required by `vendor/zed`'s own, larger
      # workspace. `libxkbcommon-x11-dev` and `libx11-xcb-dev` were already on this list
      # before `x11` was actually enabled (Revision R1 added them preemptively, R12
      # turned that into a real dependency instead of a dead one) - `apt-cache depends`
      # confirms both hard-`Depends:` (not merely `Recommends:`) on every other X11/xkb
      # `-dev` package the `x11` feature needs (`libxcb-xkb-dev`, `libx11-dev`,
      # `libxcb1-dev`), so `apt-get install`'s own dependency resolution pulls the rest
      # in automatically - no new package names were needed for R12. This trimmed list
      # has not been verified against a real GitHub Actions runner from this sandbox (no
      # way to run one here) - if a future CI run fails with an unresolved system library
      # at link time, the fix is almost certainly to restore the missing package from
      # `vendor/zed/script/linux`'s full list.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            pkg-config \
            libfontconfig-dev \
            libvulkan1 \
            mesa-vulkan-drivers \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          # `rust-analyzer` here (a rustup *component*, not a separate `cargo install`) is
          # this project's own real local-dev install method - this sandbox's own
          # `rustup component list --installed` shows exactly
          # `rust-analyzer-x86_64-unknown-linux-gnu`, with rustup placing a real proxy shim
          # at `~/.cargo/bin/rust-analyzer`, already on `PATH` via this action's own setup.
          # No separate install step is needed the way the npm-based servers below need one.
          components: rustfmt, clippy, rust-analyzer

      # The real TypeScript/Vue/Python language servers below are npm packages - this
      # installs the Node.js/npm they need. `lts/*` (not a hand-pinned version) matches
      # every other unpinned tool version already implicit elsewhere in this job (e.g. the
      # apt packages above have no pinned versions either) - this job is a build/test
      # correctness signal, not a reproducible-artifact release build.
      - name: Install Node.js (for the real language servers below)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # `lsp_hover_wiring_tests`/`lsp_diagnostics_wiring_tests` and the real, live Vue
      # end-to-end tests (`crates/app/src/root/lsp.rs`, `crates/app/src/code_view.rs` - see
      # BUILD-LOG.md's Revision R8/R8.5 entries) spawn and speak to genuinely real, live
      # language servers, never a mock or a stubbed transcript - this project's own
      # "measure, don't assume" testing discipline applied to LSP the same way it applies
      # everywhere else. Those servers must therefore genuinely exist on this runner's
      # `PATH` before `cargo test` runs below, which they don't by default. Package names
      # match `crate::language`'s own registry (`crates/app/src/language.rs`) and its
      # `install_url`s: `typescript` + `typescript-language-server` for TS/TSX/JS/JSX,
      # `pyright` (ships both the `pyright` and `pyright-langserver` binaries `crate::
      # language`'s registry actually spawns) for Python, and `@vue/language-server` for
      # `.vue`. `@vue/language-server`'s own real, required `@vue/typescript-plugin`
      # companion is *not* installed separately here - it's a genuine nested
      # `dependencies` entry in `@vue/language-server`'s own `package.json`, so this one
      # `npm install` already pulls it in under `node_modules/@vue/typescript-plugin` (see
      # `vue_typescript_plugin_location`'s own docs in `crates/app/src/language.rs` for how
      # this app resolves that path back out at runtime). `rust-analyzer` itself comes from
      # the rustup component above, not npm - it has no npm package.
      - name: Install real language servers (typescript-language-server, pyright, Vue Language Tools)
        run: npm install -g typescript typescript-language-server pyright @vue/language-server

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo build --workspace
        run: cargo build --workspace

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `--test-threads=1`, matching this project's own established local practice
      # (documented repeatedly throughout BUILD-LOG.md): several tests spawn real, live
      # child processes (a real rust-analyzer/typescript-language-server/pyright/
      # vue-language-server, real `git` worktrees, real ptys), and running them in
      # parallel has repeatedly reproduced one specific, known, pre-existing
      # `diff_render_tests` cache flake plus general resource contention on shared
      # runners - not a correctness requirement of the tests themselves, just this
      # project's own long-standing way of avoiding a flake it has hit before.
      - name: cargo test --workspace -- --test-threads=1
        run: cargo test --workspace -- --test-threads=1

  # Build-only signal on macOS and Windows, as two separate jobs (not a matrix) so all
  # three platforms read as peers in the Actions UI, rather than Linux standing alone
  # against one oddly-combined "the other two" job. This project's own dev environment
  # is Linux/WSL2-only (see BUILD-LOG.md and README.md), so these two jobs are the
  # actual, only real verification that the workspace even compiles on those platforms
  # going forward - nobody working on this repo can check that locally today (this
  # sandbox included - Revision R11, which added the real per-target Cargo.toml sections
  # below, verified them with `cargo check`/`cargo clippy --target x86_64-pc-windows-gnu`
  # and `--target aarch64-apple-darwin` for `pty-core`/`wt-core`, and `cargo check
  # --target x86_64-pc-windows-gnu` got well into `app`'s own real dependency tree before
  # hitting an unrelated missing system `x86_64-w64-mingw32-gcc` cross-compiler this
  # sandbox has no passwordless `sudo` to install - see BUILD-LOG.md's Revision R11 entry
  # for exactly how far that verification reached and what it could not reach).
  #
  # `crates/app/Cargo.toml` has real per-target `[target.'cfg(target_os =
  # "...")'.dependencies]` sections for `gpui_platform` (Revision R11, extended in R12):
  # Linux requests both the `wayland` and `x11` features, macOS and Windows request no
  # feature at all, because - unlike
  # Linux's `gpui_linux` - `gpui_platform`'s own Cargo.toml
  # (vendor/zed/crates/gpui_platform/Cargo.toml) pulls in `gpui_macos`/`gpui_windows`
  # purely from `target_os` via its own `[target.'cfg(...)'.dependencies]` sections, with
  # no corresponding top-level feature to request. So `cargo build --workspace` below
  # needs no `--features` flag on either platform: per-target dependency/feature
  # selection is Cargo's job, resolved automatically from the actual build target.
  macos:
    name: macOS (build only)
    runs-on: macos-latest
    # A real, platform-specific build-script requirement found by reading
    # `vendor/zed/crates/gpui_macos/build.rs` directly (not assumed): it unconditionally
    # shells out to `xcrun -sdk macosx metal` to compile real Metal shaders - this needs
    # a full Xcode install, not just the standalone Command Line Tools package.
    # `macos-latest` runner images ship full Xcode, so this is expected to work, but is
    # unverified from this Linux-only sandbox.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2

      - name: cargo build --workspace
        run: cargo build --workspace

  windows:
    name: Windows (build only)
    runs-on: windows-latest
    # A real, platform-specific build-script quirk found by reading
    # `vendor/zed/crates/gpui_windows/build.rs` directly (not assumed): its
    # `fxc.exe`-based HLSL shader compilation is gated behind
    # `#[cfg(not(debug_assertions))]`, i.e. release-only - this job's plain (debug)
    # `cargo build --workspace` never invokes it, so a real regression on that specific
    # path (`fxc.exe` not found, etc.) would not be caught here; only
    # `cargo build --release` would exercise it, which is out of scope for a build-only
    # signal job.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2

      - name: cargo build --workspace
        run: cargo build --workspace
