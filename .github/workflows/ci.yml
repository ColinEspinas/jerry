name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # The exact zed-industries/zed commit this workspace's GPUI path dependencies
  # (crates/app/Cargo.toml -> gpui_platform, and the workspace-level `gpui` dependency
  # in the root Cargo.toml) were built and verified against. `vendor/zed` is
  # intentionally NOT committed to this repository and is not a git submodule either
  # (see .gitignore, which ignores `vendor/` outright, and BUILD-LOG.md's "Environment
  # / setup decisions" section) — it's a full upstream checkout of a separate, very
  # large Cargo workspace (excluded from this one via `[workspace] exclude` in the
  # root Cargo.toml), so every job below fetches this exact commit fresh instead.
  #
  # Bump this only deliberately, together with re-checking out that commit locally
  # and re-running the full test/build/clippy suite against it (see CONTRIBUTING.md)
  # - never as a side effect of an unrelated change, since GPUI's API surface is not
  # stable across arbitrary upstream commits.
  ZED_VENDOR_COMMIT: 7b030b500810b04cf5fb4aa5973be99a502d9f36

jobs:
  # Full verification on Linux: this is the platform this project is actually
  # developed on (see BUILD-LOG.md), and the one GitHub's own hosted runners can
  # exercise completely, including running the real test suite (GPUI's `test-support`
  # harness does not require a display server - see crates/app/Cargo.toml's
  # `gpui`/test-support comment; Zed's own CI runs `cargo test`/`cargo nextest` the
  # same way on plain Ubuntu runners, with no Xvfb or similar).
  linux:
    name: Linux (build, test, clippy, fmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Fetch vendor/zed (pinned commit)
        shell: bash
        run: |
          set -euo pipefail
          git init vendor/zed
          git -C vendor/zed remote add origin https://github.com/zed-industries/zed
          git -C vendor/zed fetch --depth 1 origin "$ZED_VENDOR_COMMIT"
          git -C vendor/zed checkout FETCH_HEAD

      # System libraries GPUI's default Linux backend (the `wayland` gpui_platform
      # feature crates/app/Cargo.toml enables - see that file's comment on why `x11`
      # isn't enabled here) needs to *compile*: Wayland client headers, xkbcommon
      # (keyboard handling), Vulkan (gpui_wgpu's renderer), and fontconfig (cosmic-text's
      # font matching). Trimmed down from the authoritative full list at
      # `vendor/zed/script/linux`'s Ubuntu/Debian branch, which also installs several
      # packages this project's own dependency set never touches (libgit2 - wt-core
      # uses `gix`, a pure-Rust reimplementation, never libgit2; musl-tools/musl-dev -
      # no musl target is built here; pipewire/xdg-desktop-portal/libva-dev - GPUI's
      # optional `screen-capture` feature, which nothing in this workspace enables).
      # ALSA, OpenSSL, sqlite3, and zstd dev packages were dropped from this list after
      # checking `Cargo.lock` directly: no `alsa`/`alsa-sys`, `openssl-sys`,
      # `libsqlite3-sys`/`rusqlite`, or `zstd-sys`/`libz-sys` appears anywhere in this
      # workspace's resolved dependency tree, so none of those four are actually needed
      # to build it, despite being genuinely required by `vendor/zed`'s own, larger
      # workspace. This trimmed list has not been verified against a real GitHub Actions
      # runner from this sandbox (no way to run one here) - if a future CI run fails
      # with an unresolved system library at link time, the fix is almost certainly to
      # restore the missing package from `vendor/zed/script/linux`'s full list.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            pkg-config \
            libfontconfig-dev \
            libvulkan1 \
            mesa-vulkan-drivers \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo build --workspace
        run: cargo build --workspace

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace

  # Build-only signal on macOS and Windows. This project's own dev environment is
  # Linux/WSL2-only (see BUILD-LOG.md and README.md), so these jobs are the actual,
  # only real verification that the workspace even compiles on those platforms going
  # forward - nobody working on this repo can check that locally today (this sandbox
  # included - Revision R11, which added the real per-target Cargo.toml sections below,
  # verified them with `cargo check`/`cargo clippy --target x86_64-pc-windows-gnu` and
  # `--target aarch64-apple-darwin` for `pty-core`/`wt-core`, and `cargo check --target
  # x86_64-pc-windows-gnu` got well into `app`'s own real dependency tree before hitting
  # an unrelated missing system `x86_64-w64-mingw32-gcc` cross-compiler this sandbox has
  # no passwordless `sudo` to install - see BUILD-LOG.md's Revision R11 entry for exactly
  # how far that verification reached and what it could not reach).
  #
  # `crates/app/Cargo.toml` now has real per-target `[target.'cfg(target_os =
  # "...")'.dependencies]` sections for `gpui_platform` (Revision R11): Linux requests the
  # `wayland` feature, macOS and Windows request no feature at all, because - unlike
  # Linux's `gpui_linux` - `gpui_platform`'s own Cargo.toml
  # (vendor/zed/crates/gpui_platform/Cargo.toml) pulls in `gpui_macos`/`gpui_windows`
  # purely from `target_os` via its own `[target.'cfg(...)'.dependencies]` sections, with
  # no corresponding top-level feature to request. So `cargo build --workspace` below
  # needs no `--features` flag on any platform: per-target dependency/feature selection
  # is Cargo's job, resolved automatically from the actual build target.
  #
  # Two real, platform-specific build-script requirements worth recording here, found by
  # reading `vendor/zed/crates/gpui_macos/build.rs` and `gpui_windows/build.rs` directly
  # (not assumed): macOS's build script unconditionally shells out to `xcrun -sdk macosx
  # metal` to compile real Metal shaders - this needs a full Xcode install, not just the
  # standalone Command Line Tools package (`macos-latest` runner images ship full Xcode,
  # so this is expected to work, but is unverified from this Linux-only sandbox). The
  # Windows build script's `fxc.exe`-based HLSL shader compilation is gated behind
  # `#[cfg(not(debug_assertions))]`, i.e. release-only - this job's plain (debug) `cargo
  # build --workspace` never invokes it, so a real regression on that specific path
  # (`fxc.exe` not found, etc.) would not be caught here; only `cargo build --release`
  # would exercise it, which is out of scope for a build-only signal job.
  #
  # Both jobs' "Fetch vendor/zed" step already sets `shell: bash` explicitly (checked
  # for this revision, not assumed) - load-bearing on `windows-latest`, whose *default*
  # shell for a `run:` step without an explicit `shell:` is PowerShell, which the bash
  # `git init && git remote add && ...` script above would not parse correctly. `bash` is
  # available there via the Git for Windows install already bundled into GitHub's
  # `windows-latest` runner image.
  cross-build:
    name: Build only (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Fetch vendor/zed (pinned commit)
        shell: bash
        run: |
          set -euo pipefail
          git init vendor/zed
          git -C vendor/zed remote add origin https://github.com/zed-industries/zed
          git -C vendor/zed fetch --depth 1 origin "$ZED_VENDOR_COMMIT"
          git -C vendor/zed checkout FETCH_HEAD

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2

      - name: cargo build --workspace
        run: cargo build --workspace
