name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  # Build-only signal on Linux, matching macOS/Windows below - deliberately narrowed
  # from a prior "build, test, clippy, fmt" job. That job's own real fmt/clippy/test
  # steps were sound in isolation (they'd passed repeatedly before), but a real,
  # separate CI-environment gap surfaced through them: `wt-core`'s
  # `discard_worktree_refuses_when_stash_push_captures_nothing_and_an_unrelated_stash_
  # already_exists` test creates a real git repo with a submodule and commits inside
  # it, and a fresh GitHub Actions runner has no global `git config user.email`/
  # `user.name` the way a real developer machine does - `git commit` inside that test
  # fixture failed with "Author identity unknown" (real error text from a real CI run,
  # not hypothetical). Narrowing to build-only sidesteps that gap and the handful of
  # other environment-specific flakes this job's own comments already documented
  # (`diff_render_tests`' known cache flake, live-LSP-server test flakiness) rather
  # than chasing each one individually right now. Fuller CI (fmt/clippy/test, and a
  # real fix for the git-identity gap) is real follow-up work, not abandoned - see
  # this repo's own issues for the tracked follow-up.
  linux:
    name: Linux (build only)
    runs-on: ubuntu-latest
    # System libraries GPUI's Linux backend (both the `wayland` and `x11`
    # gpui_platform features are compiled in, Revision R12 - see that file's own
    # Cargo.toml comment, and `crate::gpui_linux`'s real `guess_compositor()`-based
    # runtime selection between them) needs to *compile*: Wayland client headers, X11/
    # xkbcommon headers, Vulkan (gpui_wgpu's renderer), and fontconfig (cosmic-text's
    # font matching). Trimmed down from the authoritative full list at upstream Zed's
    # own `script/linux`'s Ubuntu/Debian branch, which also installs several packages
    # this project's own dependency set never touches (libgit2 - wt-core uses `gix`, a
    # pure-Rust reimplementation, never libgit2; musl-tools/musl-dev - no musl target
    # is built here; pipewire/xdg-desktop-portal/libva-dev - GPUI's optional
    # `screen-capture` feature, which nothing in this workspace enables). OpenSSL,
    # sqlite3, and zstd dev packages were dropped from this list after checking
    # `Cargo.lock` directly: no `openssl-sys`, `libsqlite3-sys`/`rusqlite`, or
    # `zstd-sys`/`libz-sys` appears anywhere in this workspace's resolved dependency
    # tree, so none of those three are actually needed to build it, despite being
    # genuinely required by upstream Zed's own, larger workspace. `libxkbcommon-x11-dev`
    # and `libx11-xcb-dev` were already on this list before `x11` was actually enabled
    # (Revision R1 added them preemptively, R12 turned that into a real dependency
    # instead of a dead one) - `apt-cache depends` confirms both hard-`Depends:` (not
    # merely `Recommends:`) on every other X11/xkb `-dev` package the `x11` feature
    # needs (`libxcb-xkb-dev`, `libx11-dev`, `libxcb1-dev`), so `apt-get install`'s own
    # dependency resolution pulls the rest in automatically - no new package names were
    # needed for R12. `libasound2-dev` was dropped alongside OpenSSL/sqlite3/zstd for
    # the same "not in Cargo.lock" reason, but GitHub issue #226's sound design module
    # (`crate::sound`) now depends on `rodio`'s `playback` feature, which pulls in
    # `cpal`, which links ALSA on Linux (`alsa-sys` now genuinely resolves in
    # `Cargo.lock`) - so it's back, or this job fails to link on Linux.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            pkg-config \
            libfontconfig-dev \
            libvulkan1 \
            mesa-vulkan-drivers \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libasound2-dev

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2

      - name: cargo build --workspace
        run: cargo build --workspace

  # Build-only signal on macOS and Windows, as two separate jobs (not a matrix) so all
  # three platforms read as peers in the Actions UI, rather than Linux standing alone
  # against one oddly-combined "the other two" job. This project's own dev environment
  # is Linux/WSL2-only (see BUILD-LOG.md and README.md), so these two jobs are the
  # actual, only real verification that the workspace even compiles on those platforms
  # going forward - nobody working on this repo can check that locally today (this
  # sandbox included - Revision R11, which added the real per-target Cargo.toml sections
  # below, verified them with `cargo check`/`cargo clippy --target x86_64-pc-windows-gnu`
  # and `--target aarch64-apple-darwin` for `pty-core`/`wt-core`, and `cargo check
  # --target x86_64-pc-windows-gnu` got well into `app`'s own real dependency tree before
  # hitting an unrelated missing system `x86_64-w64-mingw32-gcc` cross-compiler this
  # sandbox has no passwordless `sudo` to install - see BUILD-LOG.md's Revision R11 entry
  # for exactly how far that verification reached and what it could not reach).
  #
  # `crates/app/Cargo.toml` has real per-target `[target.'cfg(target_os =
  # "...")'.dependencies]` sections for `gpui_platform` (Revision R11, extended in R12):
  # Linux requests both the `wayland` and `x11` features, macOS and Windows request no
  # feature at all, because - unlike
  # Linux's `gpui_linux` - `gpui_platform`'s own Cargo.toml
  # (vendor/zed/crates/gpui_platform/Cargo.toml) pulls in `gpui_macos`/`gpui_windows`
  # purely from `target_os` via its own `[target.'cfg(...)'.dependencies]` sections, with
  # no corresponding top-level feature to request. So `cargo build --workspace` below
  # needs no `--features` flag on either platform: per-target dependency/feature
  # selection is Cargo's job, resolved automatically from the actual build target.
  macos:
    name: macOS (build only)
    runs-on: macos-latest
    # A real, platform-specific build-script requirement found by reading
    # `vendor/zed/crates/gpui_macos/build.rs` directly (not assumed): it unconditionally
    # shells out to `xcrun -sdk macosx metal` to compile real Metal shaders - this needs
    # a full Xcode install, not just the standalone Command Line Tools package.
    # `macos-latest` runner images ship full Xcode, so this is expected to work, but is
    # unverified from this Linux-only sandbox.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2

      - name: cargo build --workspace
        run: cargo build --workspace

  windows:
    name: Windows (build only)
    runs-on: windows-latest
    # A real, platform-specific build-script quirk found by reading
    # `vendor/zed/crates/gpui_windows/build.rs` directly (not assumed): its
    # `fxc.exe`-based HLSL shader compilation is gated behind
    # `#[cfg(not(debug_assertions))]`, i.e. release-only - this job's plain (debug)
    # `cargo build --workspace` never invokes it, so a real regression on that specific
    # path (`fxc.exe` not found, etc.) would not be caught here; only
    # `cargo build --release` would exercise it, which is out of scope for a build-only
    # signal job.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2

      - name: cargo build --workspace
        run: cargo build --workspace
