[workspace]
resolver = "2"
members = [
    "crates/wt-core",
    "crates/pty-core",
    "crates/lsp-core",
    "crates/app",
]
# `vendor/zed` is its own separate Cargo workspace (it has its own `[workspace]` table
# with its own `workspace.dependencies`, e.g. `accesskit`, that gpui's Cargo.toml
# inherits from via `.workspace = true`). Without this exclude, Cargo treats every path
# dependency under `vendor/zed` that isn't an explicit member as belonging to *this*
# workspace instead, and gpui's manifest fails to parse because this workspace's
# `[workspace.dependencies]` doesn't define those keys.
exclude = ["vendor/zed"]

[workspace.package]
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
gpui = { path = "vendor/zed/crates/gpui" }
anyhow = "1"
thiserror = "1"
# Real config-file (de)serialization for `crate::settings_store::Settings`
# (`design_handoff_jerry_ade/revision/CHANGELOG.md`'s 2026-07-29 entry, change 3). Pinned to
# the exact major versions `vendor/zed/Cargo.toml` itself pins (`serde = "1.0.221"`,
# `toml = "0.8"`), matching this project's established "same versions Zed verified against"
# convention for shared dependencies (see `crates/app/Cargo.toml`'s own `tree-sitter`/
# `alacritty_terminal` comments for precedent). `serde_json` has no equivalent vendor/zed pin
# to match (Zed's own `Cargo.toml` doesn't depend on it at the workspace level), so it's a
# plain, unpinned-beyond-major-version dependency instead.
serde = { version = "1.0.221", features = ["derive"] }
toml = "0.8"
serde_json = "1"
