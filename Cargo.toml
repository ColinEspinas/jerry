[workspace]
resolver = "2"
members = [
    "crates/wt-core",
    "crates/pty-core",
    "crates/lsp-core",
    "crates/app",
]

[workspace.package]
# Single source of truth for the release version - crates inherit via `version = { workspace =
# true }` rather than pinning their own.
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

# CLAUDE.md's Rust standards, made executable. Everything here is `warn`/`deny` rather than
# `forbid`: `cargo clippy --workspace --all-targets -- -D warnings` (the pre-commit gate; see
# `/check`) is what actually turns these into build failures, and `deny` (unlike `forbid`)
# still lets each documented FFI `unsafe` block (see CLAUDE.md's Rust standards) carry a local
# `#[allow(unsafe_code)]` with its own justification. Test modules are exempted per crate root,
# not here - see each crate's `#![cfg_attr(test, allow(...))]`, matching the documented
# "expect() is fine in tests" convention.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"

[workspace.dependencies]
# Pinned to the exact zed-industries/zed commit this workspace was built and verified
# against. Bump only deliberately, together with re-running the full
# test/build/clippy suite - GPUI's API surface is not stable across arbitrary upstream
# commits.
gpui = { git = "https://github.com/zed-industries/zed", rev = "7b030b500810b04cf5fb4aa5973be99a502d9f36" }
anyhow = "1"
thiserror = "1"
# Real config-file (de)serialization for `crate::settings_store::Settings`
# (`design_handoff_jerry_ade/revision/CHANGELOG.md`'s 2026-07-29 entry, change 3). Pinned to
# the exact major versions `vendor/zed/Cargo.toml` itself pins (`serde = "1.0.221"`,
# `toml = "0.8"`), matching this project's established "same versions Zed verified against"
# convention for shared dependencies (see `crates/app/Cargo.toml`'s own `tree-sitter`/
# `alacritty_terminal` comments for precedent). `serde_json` has no equivalent vendor/zed pin
# to match (Zed's own `Cargo.toml` doesn't depend on it at the workspace level), so it's a
# plain, unpinned-beyond-major-version dependency instead.
serde = { version = "1.0.221", features = ["derive"] }
toml = "0.8"
serde_json = "1"
