[workspace]
resolver = "2"
members = [
    "crates/wt-core",
    "crates/pty-core",
    "crates/lsp-core",
    "crates/app",
]
# `vendor/zed` is its own separate Cargo workspace (it has its own `[workspace]` table
# with its own `workspace.dependencies`, e.g. `accesskit`, that gpui's Cargo.toml
# inherits from via `.workspace = true`). Without this exclude, Cargo treats every path
# dependency under `vendor/zed` that isn't an explicit member as belonging to *this*
# workspace instead, and gpui's manifest fails to parse because this workspace's
# `[workspace.dependencies]` doesn't define those keys.
exclude = ["vendor/zed"]

[workspace.package]
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
gpui = { path = "vendor/zed/crates/gpui" }
anyhow = "1"
thiserror = "1"
