[package]
name = "wt-core"
version = "0.1.0"
edition = { workspace = true }
publish = { workspace = true }
license = { workspace = true }
description = "Git worktree management (enumerate/create/remove) for the ade agent development environment"

[dependencies]
gix = { version = "0.68" }
thiserror = { workspace = true }
# Used at runtime (not just in tests) by `diff::prepare_shadow_index` to build a throwaway
# copy of the real index for `git diff`'s untracked-file handling - see that function's docs.
tempfile = "3"
