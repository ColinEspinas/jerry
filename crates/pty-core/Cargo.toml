[package]
name = "pty-core"
version = "0.1.0"
edition = { workspace = true }
publish = { workspace = true }

[dependencies]
portable-pty = "0.9.0"
thiserror = { workspace = true }
anyhow = { workspace = true }

# Reader-thread shutdown signaling (self-pipe + poll) and process-tree kill are
# currently unix-only; see the crate-level doc comment in src/lib.rs for why. Both
# crates are already transitive deps of portable-pty 0.9.0 on unix (pinned here to the
# exact versions already resolved in Cargo.lock, so this adds no new version surface).
[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", default-features = false, features = ["signal"] }
filedescriptor = "0.8"

[dev-dependencies]
# Test-only: `resolve_on_path_skips_a_same_named_directory` needs a real, isolated temporary
# directory to prepend to `$PATH` (see that test's docs). Matches the exact version
# `crates/app/Cargo.toml`/`crates/wt-core/Cargo.toml` already pin.
tempfile = "3"
