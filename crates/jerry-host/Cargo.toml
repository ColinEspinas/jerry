[package]
name = "jerry-host"
version = { workspace = true }
edition = { workspace = true }
publish = { workspace = true }
license = { workspace = true }
description = "The session host: authorizes and executes every Call, listens on the registry socket, fans out notifications, and from stage 2 owns agent sessions"

[[bin]]
name = "jerry-host"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
jerry-core = { path = "../jerry-core" }
# `SessionManager` owns the real `jerry_pty::PtySession` for every session it spawns
# (decisions.md §23) - the one place in this workspace besides `jerry-app` that links PTY
# machinery.
jerry-pty = { path = "../jerry-pty" }
futures = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = "0.4"
env_logger = "0.11"
clap = { workspace = true }

[dev-dependencies]
tempfile = "3"
test-support = { path = "../test-support" }

# Test-only "does this pid still exist" checks for `SessionManager::shutdown_all`'s own coverage
# (GitHub issue #530's regression, decisions.md §23's Part B/C) - the exact same pair
# `crate::hooks::settings_file::process_is_alive` in `jerry-app` already uses, copied rather than
# shared across a crate boundary for one test module. Already in the lock file transitively
# (`libc` via `jerry-pty`, `windows-sys` via `gpui_platform`), so this adds no new build surface.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# `crate::job_object`: `main`'s own self-adoption into a fresh kill-on-close job for this host's
# descendants (docs/architecture/decisions.md §14 point 3), copied rather than shared across a
# crate boundary from `jerry-app`'s own private `job_object.rs` - the same precedent as the
# `process_is_alive` pair above. Also the dev-dependency liveness checks `host_shutdown_tests`
# already used.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
