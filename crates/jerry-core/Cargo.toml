[package]
name = "jerry-core"
version = { workspace = true }
edition = { workspace = true }
publish = { workspace = true }
license = { workspace = true }
description = "The contract every Jerry client and host share: Command/Query traits, the JSON-RPC 2.0 frame codec, stable error codes, the per-repo host registry, and a blocking client"

[lints]
workspace = true

[dependencies]
# Git-locality Commands and Queries execute here, so standalone `jerry-cli` can run them
# without linking any host or PTY machinery (decisions.md §15).
jerry-git = { path = "../jerry-git" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Derives the `tools/list` `inputSchema` for `jerry mcp` (decisions.md §22) from the same
# Command/Query input structs the wire already (de)serializes.
schemars = { workspace = true }

# AF_UNIX on Windows 10 1803+. Pinned to the exact version already resolved in Cargo.lock
# (pulled by `zbus` via gpui), so this adds no new version surface.
[target.'cfg(windows)'.dependencies]
uds_windows = "=1.2.1"

[[bin]]
# A minimal, real executable standing in for `jerry` itself, so `RebaseStart`'s own integration
# tests (`tests/rebase_commands.rs`) can make `jerry_binary::locate` find a genuinely executable
# file - `CARGO_BIN_EXE_<name>` is only reliable for a `[[bin]]` of the *same* package inside an
# integration test, verified against this workspace's own build (a cross-crate dev-dependency, or
# any `--lib` unit test, could not see it at all). See `src/bin/test_jerry.rs`.
name = "jerry_core_test_jerry"
path = "src/bin/test_jerry.rs"

[dev-dependencies]
tempfile = "3"
test-support = { path = "../test-support" }
