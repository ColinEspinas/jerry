[package]
name = "app"
version = "0.1.0"
edition = { workspace = true }
publish = { workspace = true }
license = { workspace = true }
description = "ade (\"Jerry\"): a GPUI desktop app for supervising coding agents across parallel git worktrees"

[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
gpui = { workspace = true }
wt-core = { path = "../wt-core" }
pty-core = { path = "../pty-core" }
# Real LSP client (spawns `rust-analyzer`, real initialize/initialized handshake, real
# `textDocument/publishDiagnostics`) backing Surface C's File view Diagnostic state
# (`crate::diagnostics_view`) - see `crates/lsp-core/src/lib.rs`'s own docs for the scope
# decision (a separate crate, not a module here, mirroring `pty-core`) and the `lsp-types`
# licensing/version reasoning. `lsp_core::lsp_types` is used directly (re-exported by that
# crate) rather than this crate adding its own separate `lsp-types` dependency, so there is
# only ever one resolved version of it in this workspace.
lsp-core = { path = "../lsp-core" }
anyhow = { workspace = true }
env_logger = "0.11"
log = "0.4"
# Real ANSI/grid terminal emulation, replacing step 3's hand-rolled plain-text scan (see
# `crate::terminal_pane`'s module docs). Pinned to the exact git rev `vendor/zed/Cargo.toml`
# itself pins, so this is the same fork/version Zed's own `terminal` crate verified against.
# `vte` (alacritty_terminal's own VT100 parser) is used via `alacritty_terminal`'s own
# re-export (`alacritty_terminal::vte`, see `crate::terminal_grid`'s docs) rather than as a
# separate top-level dependency here, so there's no risk of it drifting to a different `vte`
# version than the one `alacritty_terminal` itself was built against.
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "4c129667ce56611becdc82de6e28218c80e2e88f" }
# Real Rust syntax highlighting for Surface C's File view (`crate::code_view`) - pinned to the
# exact versions `vendor/zed/Cargo.toml` itself pins (`tree-sitter = "0.26.9"`,
# `tree-sitter-rust = "0.24.2"`), so this is the same grammar/bindings pair Zed's own `language`
# crate verified against, not an independently-drifting version. `tree-sitter` is a real, exact
# `=` pin rather than a caret requirement: a bare `"0.26.9"` requirement already drifted to a
# newer real resolved version (0.26.11) the moment it was published to crates.io, silently
# breaking the "same version Zed verified against" claim above - `cargo update -p tree-sitter
# --precise 0.26.9` was run after adding the `=` here to bring `Cargo.lock` back in line.
# `tree-sitter-rust`'s own caret requirement hasn't drifted (still resolves to 0.24.2, matching
# vendor/zed's own `Cargo.lock` exactly), so it's left as a normal caret requirement.
tree-sitter = "=0.26.9"
tree-sitter-rust = "0.24.2"
# Real TypeScript/TSX and Python syntax highlighting (`crate::code_view::highlight_typescript`/
# `highlight_python`), following `highlight_rust`'s exact parse-then-walk shape - see this
# crate's own `crate::code_view` module docs. Pinned to the exact version numbers
# `vendor/zed/Cargo.lock` itself resolves (`tree-sitter-python = "0.25.0"`,
# `tree-sitter-typescript = "0.23.2"`, verified directly against that lockfile), but sourced
# from real crates.io rather than `vendor/zed`'s own git fork of `tree-sitter-typescript`
# (`git+https://github.com/zed-industries/tree-sitter-typescript?rev=e2c53597...`) - the exact
# same "real crates.io package, not zed's fork" call this crate's `lsp-core` dependency already
# made for `lsp-types`, and crates.io happens to carry the identical `0.23.2` version number zed
# verified against, so there's no functional gap from not using their fork.
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
# Real `~/.config/jerry/settings.toml` load/save (`crate::settings_store`) - see the workspace
# `Cargo.toml`'s own comment for why these three are pinned the way they are.
serde = { workspace = true }
toml = { workspace = true }
serde_json = { workspace = true }
# GitHub issue #239 phase 2: the agent-hook listener's per-launch auth token. A CSPRNG is the
# point - this codebase's usual `std::process::id()` + `AtomicU64` uniqueness convention exists
# for temp *filenames*, where predictability is free; for a token it is the whole vulnerability.
# Already in the lock file transitively (via `self_update`'s stack), so this is a direct
# dependency on a crate that was being compiled anyway rather than new build surface.
rand = "0.9"
# Real path/`path:line[:col]` link detection inside terminal output (`crate::terminal_links`) -
# pinned to the same `"1.5"` requirement `vendor/zed/Cargo.toml` itself pins, matching this
# project's established shared-dependency convention (this is a generic text-scanning utility
# crate, not a GPUI API, so it needs no `vendor/zed` call-site verification the way GPUI calls
# do - only the version-pin convention applies).
regex = "1.5"
# Real grapheme-cluster-aware cursor movement for `crate::edit_buffer::EditBuffer` (Revision
# R8.5a's File view text editing), ported from `vendor/zed/crates/gpui/examples/input.rs`'s own
# `previous_boundary`/`next_boundary` - so Left/Right/Backspace/Delete never split a multi-byte
# grapheme cluster (an emoji, an accented character built from combining marks, a CRLF pair) in
# half. Already resolved transitively (via `gpui`'s own text-shaping stack), so this promotes an
# already-locked crate to a direct dependency rather than adding new version surface - pinned to
# the exact version this workspace's `Cargo.lock` already resolves.
unicode-segmentation = "1.13.3"
# The official tree-sitter highlighting engine, driving each grammar crate's own published
# `queries/highlights.scm` - this replaced a hand-rolled recursive AST walk over per-language
# node-kind tables maintained inside `crate::code_view`. Pinned with an exact `=` to the same
# version as `tree-sitter` itself above, for a stronger reason than matching style: this crate is
# released in lockstep with `tree-sitter` (it shares its version numbers) and its own manifest
# requires `tree-sitter ^0.26.9`, read directly from the published crate rather than assumed. A
# bare caret here would resolve to whatever the newest `0.26.x` is, which is exactly the silent
# drift the `tree-sitter = "=0.26.9"` pin above was already added to stop. Not present anywhere in
# `vendor/zed`, which hand-writes its own self-contained query files instead - so unlike the GPUI
# APIs, there is no in-tree call site to verify against, and `crate::code_view`'s docs instead cite
# the real crate source on disk for every non-obvious behaviour they rely on.
tree-sitter-highlight = "=0.26.9"
# `tree_sitter::QueryCursor::matches` returns a `QueryMatches` that implements **only**
# `streaming_iterator::StreamingIterator`, not `Iterator` - deliberately, because the underlying C
# object is overwritten on each step, so handing out copies would be undefined behaviour (read
# directly from `tree-sitter-0.26.9/binding_rust/lib.rs:3404-3436`). Iterating one therefore
# requires this trait in scope. Already in the lockfile as `tree-sitter`'s and
# `tree-sitter-highlight`'s own transitive dependency at this exact version, so naming it here adds
# a real, direct use of a crate already being compiled rather than any new weight. Used by
# `crate::code_surface::code_view::injection_scopes`.
streaming-iterator = "0.1.9"
# Depended on for its *query file*, not its grammar - this app never parses anything with the
# JavaScript grammar (`.js`/`.jsx` deliberately reuse the TypeScript/TSX ones, see
# `crate::code_view::highlight_typescript`). `tree-sitter-typescript`'s own `HIGHLIGHTS_QUERY` is
# a 35-line supplement covering types and TypeScript-only keywords and nothing else; upstream
# expects it concatenated onto JavaScript's, and without that every TypeScript string, comment and
# function call would silently render as plain text. See
# `crate::code_view::highlight_query_for`'s own docs. `0.23.1` is the release paired with the
# already-pinned `tree-sitter-typescript = "0.23.2"` (the two are versioned in step upstream), so
# the query file matches the node kinds that grammar actually emits; that the composed query
# really does compile against both the TypeScript and the TSX grammars is not assumed either -
# `crate::code_view`'s `every_real_grammar_config_compiles` test asserts it.
tree-sitter-javascript = "0.23.1"
# Real OS-level filesystem watching for the worktree sidebar's live refresh (GitHub issue #12,
# `crate::rail::worktree_watch`) - `crate::rail::render::AdeApp::start_worktree_watch` keeps a
# `notify::RecommendedWatcher` alive on `$GIT_COMMON_DIR/worktrees` (recursive) and
# `$GIT_COMMON_DIR/HEAD`, so `git worktree add/remove/lock` and branch switches inside any
# worktree are noticed within about a second, without falling back solely to the 5s poll that
# backstops the (rarer, event-less) case of a worktree's own directory being deleted out from
# under it. The default feature set is kept (no `--no-default-features`): on Linux this pulls in
# `inotify`, matching every other platform-selection convention in this file (`gpui_platform`'s
# own per-target sections above) rather than hand-picking a narrower backend per OS. Plain
# `crates.io`, unpinned beyond the major version `cargo add` resolved (`8.2.0`) - a generic OS
# API wrapper with no GPUI/vendor/zed call site to verify against, the same "just a version pin"
# treatment `regex`/`unicode-segmentation` already get above.
notify = "8.2.0"
# Real GitHub-releases-backed self-update (GitHub issue #87, `crate::updater`) - version
# check via `backends::github::ReleaseList`, download+extract+atomic self-replace via
# `backends::github::Update`/`self-replace`. `default-features = false` because this
# version's real default (`["reqwest", "default-tls"]`, verified against the published
# `0.44.0` Cargo.toml via `docs.rs/crate/self_update/0.44.0/source/Cargo.toml` and a real
# `cargo add --dry-run` resolution, not assumed from the crate's own README, which - as of
# this writing - describes a different, not-yet-released feature set) pulls in `default-tls`
# (OpenSSL) instead of `rustls`. `reqwest` is re-added explicitly: it is *not* implied by any
# archive/TLS feature and without it (or `ureq`) there is no HTTP client backend at all and
# the crate fails to compile - a real gap in the originally-planned feature list this
# dependency was added with, caught by the same `cargo add --dry-run` resolution above rather
# than assumed from docs. `archive-tar`/`archive-zip`/`compression-flate2`/
# `compression-zip-deflate` match `release.yml`'s real asset shapes (`jerry-linux.tar.gz`,
# `jerry-macos.tar.gz` as gzip-compressed tarballs; `jerry-windows.zip` as a
# deflate-compressed zip) - `compression-zip-bzip2` is omitted since nothing in this repo
# ever produces a bzip2-compressed zip.
self_update = { version = "0.44.0", default-features = false, features = [
    "rustls",
    "reqwest",
    "archive-tar",
    "archive-zip",
    "compression-flate2",
    "compression-zip-deflate",
] }
# GitHub issue #32's "add language highlight support... at least support for all common used
# languages even configuration languages" - five more real grammars, following `tree-sitter-rust`'s
# own precedent above: plain, unpinned-beyond-`cargo add`'s-own-resolution crates.io packages,
# since none of these are `vendor/zed`-verified GPUI APIs needing a call-site check, the same
# treatment `regex`/`unicode-segmentation`/`notify` already get. `tree-sitter-toml-ng`, not
# `tree-sitter-toml`: the plain-named crate is stuck at a real, stale `0.20.0` (crates.io
# checked directly), predating the `LanguageFn`-based API this workspace's pinned `tree-sitter =
# "=0.26.9"` needs; `-ng` is the actively-maintained fork that actually builds against it. See
# `crate::code_surface::code_view`'s own module docs for the real, verified capture names each
# grammar's bundled `queries/highlights.scm` was checked against.
tree-sitter-toml-ng = "0.7.0"
tree-sitter-json = "0.24.8"
tree-sitter-yaml = "0.7.2"
tree-sitter-go = "0.25.0"
tree-sitter-c = "0.24.2"
tree-sitter-md = "0.5.3"
# GitHub issue #154 ("Add html and css support. Including in the markdown files."), same plain
# crates.io treatment as every grammar above. Note the two crates export their query constants
# under *different* names - `tree-sitter-html::HIGHLIGHTS_QUERY`/`INJECTIONS_QUERY` (plural on
# both) versus `tree-sitter-css::HIGHLIGHTS_QUERY` and no injections file at all - checked
# against each crate's own `bindings/rust/lib.rs`, not assumed from the neighbouring entries
# (`tree-sitter-c` and `tree-sitter-javascript`, for instance, both use the *singular*
# `HIGHLIGHT_QUERY`). `tree-sitter-html` also ships a real `queries/injections.scm` that
# `crate::code_surface::code_view` genuinely drives - `<style>` content into the CSS grammar and
# `<script>` content into this crate's TypeScript grammar - which is why these two land together.
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"
# GitHub issue #226's sound design module (`crate::sound`) - real audio playback for the app-start
# chime and the agent-attention sounds, decoding both the bundled built-in library
# (`assets/sounds/`) and anything the user drops in `~/.config/jerry/sounds/`. `rodio`, not
# `cpal` directly: `cpal` alone is only the output-stream/device layer, with no decoder and no
# mixer, and this crate needs both (several agents finishing at once must not require hand-rolled
# sample mixing). Plain crates.io, unpinned beyond the major version `cargo add` resolved
# (`0.22.2`) - a generic audio-playback crate with no GPUI/vendor/zed call site to verify against,
# the same "just a version pin" treatment `regex`/`unicode-segmentation`/`notify` already get
# above. `default-features = false` because the real default (`symphonia-flac`, `-mp4`, `-aac`,
# `recording`, `dither`/`noise`, verified against the published `0.22.2` Cargo.toml's own
# `[features]` table, not assumed) pulls in three container/codec pairs and a whole recording
# stack this app never uses - every sound here is either a bundled or user-imported short WAV/MP3
# clip, never a live-recorded or FLAC/MP4 one. Features kept: `playback` (the `cpal` output stream
# itself), `wav` (`symphonia-wav`+`symphonia-pcm`, the bundled library's own format), `mp3`
# (`symphonia-mp3`) and `vorbis` (`symphonia-ogg`+`symphonia-vorbis`, together the two demuxer/
# decoder pairs the settings page's sound-library importer accepts alongside WAV). `cpal` is what
# actually reintroduces `libasound2-dev` on Linux (see this crate's own README/CI comments next to
# that package) - `rodio` itself has no system dependency beyond what `cpal` already requires.
rodio = { version = "0.22.2", default-features = false, features = [
    "playback",
    "wav",
    "mp3",
    "vorbis",
] }

# Real per-target `gpui_platform` backend selection (Revision R11, extended in R12 to add
# real X11 support). `gpui_platform`'s own Cargo.toml
# (`vendor/zed/crates/gpui_platform/Cargo.toml`) pulls in `gpui_macos`/`gpui_windows`
# unconditionally via its own `[target.'cfg(target_os = "...")'.dependencies]` sections -
# there is no top-level feature to request for those two backends, they're selected
# automatically by `target_os` alone. `wayland`/`x11` are real features of that crate, but
# only meaningful ones: `wayland = ["gpui_linux/wayland"]` / `x11 = ["gpui_linux/x11"]`, and
# `gpui_linux` itself is only a dependency at all under `cfg(any(target_os = "linux",
# target_os = "freebsd"))` - so only the Linux/FreeBSD block below requests either.
#
# Both `wayland` and `x11` are enabled together, matching `gpui_linux`'s own `default =
# ["wayland", "x11"]` in `vendor/zed/crates/gpui_linux/Cargo.toml` - they are NOT mutually
# exclusive at compile time. Verified directly against `gpui_linux`'s own platform-selection
# source (`vendor/zed/crates/gpui_linux/src/linux.rs`'s `current_platform`), which calls
# `gpui::guess_compositor()` (`vendor/zed/crates/gpui/src/platform.rs`) to pick a backend at
# *runtime*: that function checks `$WAYLAND_DISPLAY` (only read at all when the `wayland`
# feature is compiled in) first, falls back to checking `$DISPLAY` (only read when `x11` is
# compiled in) if Wayland isn't present, and falls back to a headless client if neither is
# set. So enabling only one of the two features at compile time doesn't just change a
# default, it removes the other backend's env-var check entirely (`cfg(not(feature =
# "wayland"))` hard-codes `wayland_display` to `None`) - real runtime auto-detection between
# a Wayland compositor and a bare X11 display requires both features compiled in
# simultaneously, which is exactly what Zed's own default does.
#
# `x11` was previously disabled here (pre-R12) because this sandbox's `libxkbcommon-x11`/
# `libx11-xcb`/`libxcb-xkb` `-dev` packages weren't installed and there was no passwordless
# `sudo` to add them. Re-investigated for R12: `apt-cache depends libxkbcommon-x11-dev` shows
# it hard-`Depends:` on `libxcb-xkb-dev` (not merely `Recommends:`), and `libx11-xcb-dev`
# hard-`Depends:` on `libx11-dev`/`libxcb1-dev` - so a real `sudo apt-get install
# libxkbcommon-x11-dev libx11-xcb-dev` (the exact two packages already listed in this
# project's README/CI, see those files' own comments) pulls in every X11/xkb `-dev` package
# `gpui_linux`'s `x11` feature needs, with no additional packages required. Confirmed for
# real in this sandbox (still no passwordless `sudo`) by downloading those same two `.deb`s
# plus their real `libxcb-xkb-dev` dependency with `apt-get download` (which needs no root),
# extracting them to a local prefix with `dpkg-deb -x`, and building/running this crate
# against that prefix via `CPATH`/`LIBRARY_PATH`/`LD_LIBRARY_PATH` - see BUILD-LOG.md's R12
# entry for the exact commands and what was visually confirmed (a real X11 window,
# screenshotted with `scrot`) versus what remains unverified (a real system-wide `apt-get
# install` in this sandbox, which still needs an interactive `sudo` password this session
# does not have - CI, which runs as root, is unaffected by that limitation).
#
# This section's own `cfg` predicate is deliberately `cfg(any(target_os = "linux", target_os =
# "freebsd"))`, matching `gpui_linux`'s own gate exactly, NOT a `target_os = "linux"`-only
# predicate. An earlier version of this revision used the narrower, Linux-only predicate here,
# which silently regressed FreeBSD: `gpui_linux` (and so a real, working GPUI backend) was
# genuinely reachable on FreeBSD via this same crate before this revision's Cargo.toml change,
# and a Linux-only `cfg` here would leave FreeBSD with no `gpui_platform` dependency at all -
# a hard, silent compile failure on a platform this app could previously target, and one this
# same revision's own `an_unrecognized_target_os_falls_back_to_xdg_open` test (which uses
# `"freebsd"` as one of its real cases) already treats as a supported target elsewhere in this
# crate.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "7b030b500810b04cf5fb4aa5973be99a502d9f36", features = [
    "wayland",
    "x11",
] }

# macOS: `gpui_macos` is pulled in by `gpui_platform` itself purely from `target_os`, but text
# rendering is NOT automatic - `gpui_macos`'s own `font-kit` feature (which pulls in its real
# `zed-font-kit`-backed system font matching/shaping) is optional and off by default, and
# `gpui_platform` only forwards it via its own same-named `font-kit` feature
# (`font-kit = ["gpui_macos/font-kit"]` in `vendor/zed/crates/gpui_platform/Cargo.toml`).
# Without it, the app builds and runs but logs `gpui_macos::platform: gpui_macos was compiled
# without the "font-kit" feature, so no text will be rendered` and shows a real, empty window -
# confirmed the hard way running this app on macOS for the first time (see BUILD-LOG.md).
[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "7b030b500810b04cf5fb4aa5973be99a502d9f36", features = [
    "font-kit",
] }

# Windows: same as macOS - `gpui_windows` (and `gpui`'s own `windows-manifest` feature) are
# pulled in automatically by `gpui_platform`'s own Windows target section.
[target.'cfg(target_os = "windows")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "7b030b500810b04cf5fb4aa5973be99a502d9f36" }

# Unix only, and used for exactly one thing: `kill(pid, 0)` as the portable POSIX check for
# whether a process still exists, so `crate::hooks::settings_file` can sweep launch directories
# left behind by a Jerry that was SIGKILLed (where `Drop` never runs) without ever deleting a
# live instance's working directory - an age-based sweep would eventually do exactly that to a
# long-running window. Already in the lock file transitively, so no new build surface.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# `test-support` unlocks GPUI's real interactive test harness (`#[gpui::test]`,
# `TestAppContext`/`VisualTestContext` - a real window, real focus tracking, real action
# dispatch/keystroke simulation, not a mock). Kept as a permanent dependency, not a temporary
# one: `crate::root`'s palette-focus regression tests (see that module's `palette_focus_tests`)
# exist specifically to catch the class of bug a plain unit test structurally cannot - a
# `Window::focus` handle left dangling after an element stops rendering - and are worth the
# real, ongoing cost of exercising GPUI's actual dispatch/focus code paths on every `cargo
# test` run, not just its own pure logic.
gpui = { workspace = true, features = ["test-support"] }
# Test-only: verifies the embedded font bytes in `crate::fonts` against their real name
# tables/OS-2 weight class (see `crate::fonts`'s test module). Already resolved
# transitively (via `gpui`'s `cosmic-text`/`fontdb`, which this crate depends on for its
# real Linux text system - see `crate::fonts`'s "Weight resolution" docs), so this only
# promotes an already-locked crate to a direct (test-only) dependency rather than adding
# new version surface. Pinned to the exact version this workspace's `Cargo.lock` resolves.
ttf-parser = "0.25.1"
