[package]
name = "app"
version = "0.1.0"
edition = { workspace = true }
publish = { workspace = true }

[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
gpui = { workspace = true }
# Only the `wayland` backend is enabled by default: the `x11` feature link-fails on this
# dev machine because `libxkbcommon-x11`/`libxcb-xkb` aren't installed system packages here
# and there's no passwordless sudo to install them (see the step-3 report for how `x11` was
# still verified to render correctly, via a temporary local workaround). WSLg (this dev
# machine) provides a real Wayland compositor (`WAYLAND_DISPLAY=wayland-0`), so `wayland`
# alone is sufficient for `cargo build -p app` to produce a working, launchable binary here.
gpui_platform = { path = "../../vendor/zed/crates/gpui_platform", features = [
    "wayland",
] }
wt-core = { path = "../wt-core" }
pty-core = { path = "../pty-core" }
anyhow = { workspace = true }
env_logger = "0.11"
log = "0.4"
# Real ANSI/grid terminal emulation, replacing step 3's hand-rolled plain-text scan (see
# `crate::terminal_pane`'s module docs). Pinned to the exact git rev `vendor/zed/Cargo.toml`
# itself pins, so this is the same fork/version Zed's own `terminal` crate verified against.
# `vte` (alacritty_terminal's own VT100 parser) is used via `alacritty_terminal`'s own
# re-export (`alacritty_terminal::vte`, see `crate::terminal_grid`'s docs) rather than as a
# separate top-level dependency here, so there's no risk of it drifting to a different `vte`
# version than the one `alacritty_terminal` itself was built against.
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "4c129667ce56611becdc82de6e28218c80e2e88f" }

[dev-dependencies]
tempfile = "3"
