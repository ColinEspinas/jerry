green_bg_hover  = "#315543"
green_fg        = "#8fbba2"
green_keycap    = "#395e4a"
green_keycap_fg = "#7eac93"
blue_bg         = "#283847"
blue_bg_hover   = "#304356"
blue_fg         = "#95b0c9"
blue_keycap     = "#395267"
amber_bg        = "#352b1a"
amber_bg_hover  = "#42361f"
amber_fg        = "#bb9c65"
danger_fg       = "#a46963"
danger_fg_hover = "#bd827c"

# Toggle switches and the Changes-panel staging checkbox.
[toggle]
track_on       = "#356049"
track_off      = "#232629"
knob_on        = "#afc9ba"
knob_off       = "#606469"
checkbox_hover = "#416b51"

# Settings-surface-only colours read directly from Jerry.dc.html's inline literals for the
# settingsOpen block - real values present in the mockup but missing from tokens.rs's
