# Moss - a bundled Jerry theme, and a worked example of the theme file format.
#
# GENERATED FILE. Every colour below was derived from Jerry Dark's own palette by the
# HSL transform in `crate::theme::derive_shift`, using this theme's five original
# swatches (#0f1310, #1a201b, #7fc79a, #c8b45a, #6f9bb5), then written out literally - so it renders
# exactly as this theme always has while being an ordinary, hand-editable theme file
# with no special status.
#
# Regenerate with `crate::settings::builtin_themes` - see that module's docs.
#
# Every key below is optional. Anything this file does not name is inherited from the theme in
# `base`, and ultimately from Jerry Dark's own built-in value - so deleting a line is a real,
# supported edit, and a file that sets three keys is a complete theme. New keys added by future
# Jerry versions simply inherit too; nothing here has to be kept exhaustive.

name = "Moss"
subtitle = "green-tinted"
base = "Jerry Dark"

# The five swatches this theme's card shows on the Themes page.
preview = ["#0f1310", "#1a201b", "#7fc79a", "#c8b45a", "#6f9bb5"]


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Surfaces and structure
# ──────────────────────────────────────────────────────────────────────────────────────────────

# Backgrounds - every solid fill in the app, from the window itself down to popovers, hover
# states and keycaps.
[surface]
window                = "#101112"  # window body
window_border         = "#25282a"
title_bar             = "#121315"
rail                  = "#121214"  # left rail + right panel
center                = "#141618"  # work surface
pty                   = "#0f1112"  # agent CLI + terminal
header                = "#131517"  # context bar, panel headers
footer                = "#131416"  # surface footers, status strips
card                  = "#171a1c"  # composer, settings cards
card_sunk             = "#141719"  # card footers
popover               = "#191c1f"  # completion popup, hover card
palette               = "#16181a"
scrim                 = "#090a0b"  # at 62% alpha behind the palette
row_hover             = "#16181a"
row_hover_alt         = "#1b1e20"  # hover on chrome buttons
row_selected          = "#1b1d1f"
segment_track         = "#181a1c"
segment_active        = "#24282b"
keycap                = "#191c1e"
keycap_hint           = "#16181a"  # The hint-size keycap's own background
chip_neutral          = "#222528"
current_line          = "#191c1f"
title_bar_close_hover = "#b22b35"
menu_row_hover        = "#1d2123"
tab_close_hover       = "#232629"  # A file tab's close-affordance hover fill

# The 1px rules that separate things - zone edges, card and popover outlines, and the
# selected-row edge.
[border]
zone            = "#1e2123"  # between the three zones
inner           = "#1c1f21"  # between bands inside a zone
rail_inner      = "#1a1c1e"
row             = "#181a1b"  # change-list row separators
divider         = "#222427"  # 1px vertical rules
card            = "#232629"
card_field      = "#222528"
composer        = "#24272a"
popover         = "#2a2e32"
button          = "#292c2f"  # outline button
button_disabled = "#1f2224"
keycap          = "#26292d"
keycap_hint     = "#222528"  # The hint-size keycap's own border
selected_edge   = "#405161"  # 2px left edge on a selected row

# The Files tree's own structural marks (GitHub issue #18 §3).
[tree]
indent_guide        = "#222427"
indent_guide_active = "#405161"  # The guide for a level in the selected file's ancestor chain

# The overlay scrollbar's own colours (GitHub issue #30) - not from design_handoff_jerry_ade
# (that mockup has no scrollbar spec at all: every scrollable region there relies on raw,
# invisible browser/OS scrolling), so these are a deliberate, judgment-call derivation from
# existing neutral tokens rather than a transcription.
[scrollbar]
thumb       = "#363a3d"
thumb_hover = "#4f5358"


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Text
# ──────────────────────────────────────────────────────────────────────────────────────────────

# The interface text ramp, brightest to dimmest.
[text]
selected   = "#bec5cc"
primary    = "#b7bdc3"
heading    = "#aeb3b9"
strong     = "#a9aeb3"
body       = "#a1a7ae"
secondary  = "#949aa1"
muted      = "#888e94"
dim        = "#7b8085"
dimmer     = "#70757a"
faint      = "#616569"
fainter    = "#56595d"
ghost      = "#484c50"
ghoster    = "#404448"
hint       = "#3d4043"
gutter     = "#363a3d"
disabled   = "#393c40"
path       = "#45484d"
tree_caret = "#45484d"  # The file tree row's ▾/▸ caret


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Meaning and state (colour carries information here)
# ──────────────────────────────────────────────────────────────────────────────────────────────

# Status is the only place colour carries meaning in the rail.
[status]
ask           = "#bd8f3b"  # needs input
ask_bg        = "#322918"
fail          = "#c35a54"
fail_bg       = "#332020"
review        = "#589c73"
review_bg     = "#203328"
run           = "#5386b7"
run_bg        = "#212c36"
idle          = "#4f5358"
idle_bg       = "#222427"
ask_card_bg   = "#1b1712"
ask_card_edge = "#6e572b"
ask_card_fg   = "#aa884d"
banner_bg     = "#1a1712"
banner_border = "#2d271c"

# Diff and change colours - added/removed line fills and signs, hunk headers, and the
# change-list stat bars.
[diff]
add_bg     = "#141f1a"
add_fg     = "#8ab89d"
add_sign   = "#4e755f"
del_bg     = "#1f1718"
del_fg     = "#bd8f8b"
del_sign   = "#875d5a"
ctx_fg     = "#777c82"
hunk_bg    = "#16181b"
hunk_fg    = "#575b60"
fold_bg    = "#131517"
fold_fg    = "#45484d"
stat_add   = "#5c826c"  # "+142" label
stat_del   = "#96635f"  # "-8" label
stat_empty = "#222427"  # unused segment of the 5-bar
git_gutter = "#2f523f"  # 3px agent-touched marker

# Small status tags and the file tree's own A/M change marks.
[tag]
"new.fg"      = "#71ae89"
"new.bg"      = "#203328"
"deleted.fg"  = "#b87b76"
"deleted.bg"  = "#332020"
"conflict.fg" = "#c39e59"
"conflict.bg" = "#322918"
tree_added    = "#5c826c"  # "A" mark
tree_modified = "#847345"  # "M" mark

# Tokens used only by the Revision R12 rail rewrite (design_handoff_jerry_ade/revision 3/
# REVISION-2026-07-31.md §2) that have no exact match elsewhere in this module - every other
# colour that section calls for (the branch/note/model/activity greys, the amber flag, the
# spine/selection edges) already has one, reused directly at the call site rather than
# duplicated here under a second name.
[rail]
repo_header_name   = "#6c7075"
worktree_active_bg = "#191c1e"
worktree_hover_bg  = "#17191b"  # Worktree row hover background (§2.2: "hover #16191c").
prunable_edge      = "#2d3134"

# One tint per agent.
[agent]
"sonnet.fg" = "#ba9546"
"sonnet.bg" = "#2c2514"
"codex.fg"  = "#60a172"
"codex.bg"  = "#1f2d26"
"haiku.fg"  = "#b17ea7"
"haiku.bg"  = "#2e212b"
"local.fg"  = "#7086ba"
"local.bg"  = "#222838"


# ──────────────────────────────────────────────────────────────────────────────────────────────
# The code surface
# ──────────────────────────────────────────────────────────────────────────────────────────────

# The editor's per-scope syntax palette - one ColorToken per tree-sitter-highlight capture
# bucket crate::code_surface::code_view::HighlightKind classifies a token into.
[syntax]
text                      = "#979ca7"
keyword                   = "#9f6ab5"
function                  = "#6597cc"
function_method           = "#6597cc"
type                      = "#c5ab73"
type_builtin              = "#c5ab73"
constant                  = "#a68460"
constant_builtin          = "#a68460"
string                    = "#89a364"
string_escape             = "#abc085"  # string.escape
number                    = "#a68460"
comment                   = "#555961"
comment_doc               = "#70747d"  # comment.doc
variable                  = "#a67991"  # variable
variable_parameter        = "#9f5464"
variable_builtin          = "#a68460"  # variable.builtin (self/this/super/cls)
property                  = "#699bae"  # property (a field/attribute access
operator                  = "#979ca7"  # operator (+, ==, &&, ...)
punctuation_bracket       = "#979ca7"
punctuation_delimiter     = "#979ca7"  # punctuation.delimiter (,/;/:/./::)
bracket_1                 = "#d06f6a"
bracket_2                 = "#6ebda4"
bracket_3                 = "#a1784c"
bracket_4                 = "#7f6fa5"
bracket_5                 = "#617851"
bracket_6                 = "#3c7c9c"
tag                       = "#c5ab73"
attribute                 = "#71a19b"
embedded                  = "#979ca7"
heading                   = "#c5ab73"  # GitHub issue #104's own real, prose-specific buckets
link                      = "#6597cc"
strong                    = "#b6bdca"  # text.strong (**bold**)
emphasis                  = "#b291c1"  # text.emphasis (*italic*)
caret                     = "#5386b7"
error_underline           = "#c35a54"  # 2px dotted
hover_underline           = "#506c89"  # 1px solid
diagnostic_row_bg         = "#191517"
diagnostic_inline_message = "#5c4745"
diagnostic_card_message   = "#c97e78"

# The File view's structural chrome (GitHub issue #31's "editor chrome" checklist item) -
# selection, the current-line highlight, the caret, and a handful of tokens for editor features
# that are real schema slots but have **no real renderer yet** in this codebase
# (matching-bracket highlighting, indent guides inside the code surface itself - distinct from
# tree's file-*tree* indent guides, which are real and already painted -, whitespace marks, a
# minimap, blame text, and a removed-line gutter marker).
[editor]
selection           = "#5386b7"  # The active text selection fill's base colour
selection_inactive  = "#5386b7"
current_line        = "#191c1f"  # The current-line highlight
caret               = "#5386b7"  # The caret bar
matching_bracket    = "#2f4253"  # A matched/matching bracket pair's highlight fill.
indent_guide        = "#222427"
indent_guide_active = "#405161"  # The indent guide for the level the caret currently sits in.
whitespace          = "#3d4043"
minimap_bg          = "#141618"  # A minimap's own background fill.
gutter_text         = "#363a3d"  # The line-number gutter's text colour
gutter_text_active  = "#7b8085"  # The current row's own brighter gutter-number colour
gutter_bg           = "#141618"  # The gutter column's own background fill.
blame_text          = "#616569"  # Inline git-blame annotation text.
diff_added          = "#2f523f"  # An added line's gutter marker
diff_removed        = "#875d5a"  # A removed line's own gutter marker.

# The terminal and agent CLI surface - prompt, output, its own status tones, and clickable path
# links.
[term]
prompt               = "#7ba5cc"
text                 = "#93989e"
dim                  = "#616569"
ok                   = "#60a172"
err                  = "#c35a54"
warn                 = "#ba9546"
heading              = "#b3b9c0"
activity             = "#5386b7"  # spinner / progress line
menu_sel_fg          = "#c39e59"
menu_sel_bg          = "#1d1a12"
cursor               = "#5386b7"
link                 = "#6e9dc8"
link_underline       = "#425d76"
link_hover           = "#8ab3d8"
link_underline_hover = "#6b93b6"

# Exact colours for Surface C's real Completions popup item rows - read directly from
# design_handoff_jerry_ade/revision/Jerry.dc.html's own completions/KBG/KFG data (the sel ? ...
[completions_popup]
item_selected_bg   = "#273644"
item_selected_fg   = "#c3cad3"
item_fg            = "#a1a7ae"
"kind_function.fg" = "#7ba5cc"
"kind_function.bg" = "#273644"
"kind_variable.fg" = "#ba9546"
"kind_variable.bg" = "#2c2514"
"kind_type.fg"     = "#ac80c7"
"kind_type.bg"     = "#2f2236"


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Chrome and widgets
# ──────────────────────────────────────────────────────────────────────────────────────────────

# Buttons, by role: green (primary/confirm), blue (secondary), amber (attention) and the danger
# red.
[button]
green_bg        = "#274436"
green_bg_hover  = "#2f5040"
green_fg        = "#89c3a0"
green_keycap    = "#395a47"
green_keycap_fg = "#7ab091"
blue_bg         = "#273644"
blue_bg_hover   = "#2f4253"
blue_fg         = "#8ab3d8"
blue_keycap     = "#395063"
amber_bg        = "#322918"
amber_bg_hover  = "#3e331d"
amber_fg        = "#c39e59"
danger_fg       = "#aa6862"
danger_fg_hover = "#c97e78"

# Toggle switches and the Changes-panel staging checkbox.
[toggle]
track_on       = "#335a45"
track_off      = "#222528"
knob_on        = "#a9d5ba"
knob_off       = "#616569"
