subtitle                = "#6a6f73"
card_row_sep            = "#1f2224"
agent_ready             = "#589c73"  # A binary-found status dot on the Agents page.
agent_not_found         = "#c35a54"  # A binary-not-found status dot on the Agents page
worktree_prunable_dot   = "#3b3f43"  # The Worktrees page's "merged and prunable" row dot
