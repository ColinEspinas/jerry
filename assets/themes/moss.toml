# Moss - a bundled Jerry theme, and a worked example of the theme file format.
#
# GENERATED FILE. Every colour below was derived from Jerry Dark's own palette by the
# HSL transform in `crate::theme::derive_shift`, using this theme's five original
# swatches (#0f1310, #1a201b, #7fc79a, #c8b45a, #6f9bb5), then written out literally - so it renders
# exactly as this theme always has while being an ordinary, hand-editable theme file
# with no special status.
#
# Regenerate with `crate::settings::builtin_themes` - see that module's docs.
#
# Every key below is optional. Anything this file does not name is inherited from the theme in
# `base`, and ultimately from Jerry Dark's own built-in value - so deleting a line is a real,
# supported edit, and a file that sets three keys is a complete theme. New keys added by future
# Jerry versions simply inherit too; nothing here has to be kept exhaustive.

name = "Moss"
subtitle = "green-tinted"
base = "Jerry Dark"

# The five swatches this theme's card shows on the Themes page.
preview = ["#0f1310", "#1a201b", "#7fc79a", "#c8b45a", "#6f9bb5"]


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Surfaces and structure
# ──────────────────────────────────────────────────────────────────────────────────────────────

# Backgrounds - every solid fill in the app, from the window itself down to popovers, hover
# states and keycaps.
[surface]
window                = "#111213"  # window body
window_border         = "#26292c"
title_bar             = "#131416"
rail                  = "#131415"  # left rail + right panel
center                = "#161719"  # work surface
pty                   = "#101213"  # agent CLI + terminal
header                = "#151618"  # context bar, panel headers
footer                = "#141517"  # surface footers, status strips
card                  = "#181b1d"  # composer, settings cards
card_sunk             = "#16181a"  # card footers
popover               = "#1a1d20"  # completion popup, hover card
palette               = "#17191c"
scrim                 = "#0a0b0b"  # at 62% alpha behind the palette
row_hover             = "#17191c"
row_hover_alt         = "#1d1f22"  # hover on chrome buttons
row_selected          = "#1c1f21"
segment_track         = "#191b1d"
segment_active        = "#25292c"
keycap                = "#1a1d1f"
keycap_hint           = "#17191b"  # The hint-size keycap's own background
chip_neutral          = "#232629"
current_line          = "#1a1d20"
title_bar_close_hover = "#be392f"
menu_row_hover        = "#1e2225"
tab_close_hover       = "#24272a"  # A file tab's close-affordance hover fill

# The 1px rules that separate things - zone edges, card and popover outlines, and the
# selected-row edge.
[border]
zone            = "#1f2224"  # between the three zones
inner           = "#1d2023"  # between bands inside a zone
rail_inner      = "#1b1d1f"
row             = "#191b1d"  # change-list row separators
divider         = "#232528"  # 1px vertical rules
card            = "#24272a"
card_field      = "#232629"
composer        = "#24282c"
popover         = "#2b2f34"
button          = "#2a2d31"  # outline button
button_disabled = "#202326"
keycap          = "#272a2e"
keycap_hint     = "#232629"  # The hint-size keycap's own border
selected_edge   = "#3f5264"  # 2px left edge on a selected row

# The Files tree's own structural marks (GitHub issue #18 §3).
[tree]
indent_guide        = "#232528"
indent_guide_active = "#3f5264"  # The guide for a level in the selected file's ancestor chain

# The overlay scrollbar's own colours (GitHub issue #30) - not from design_handoff_jerry_ade
# (that mockup has no scrollbar spec at all: every scrollable region there relies on raw,
# invisible browser/OS scrolling), so these are a deliberate, judgment-call derivation from
# existing neutral tokens rather than a transcription.
[scrollbar]
thumb       = "#373a3e"
thumb_hover = "#4f5459"


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Text
# ──────────────────────────────────────────────────────────────────────────────────────────────

# The interface text ramp, brightest to dimmest.
[text]
selected   = "#bec2c6"
primary    = "#b6babd"
heading    = "#adb1b4"
strong     = "#a8acaf"
body       = "#a0a5aa"
secondary  = "#94989e"
muted      = "#878c91"
dim        = "#7b7f83"
dimmer     = "#6f7479"
faint      = "#606469"
fainter    = "#55595e"
ghost      = "#484c50"
ghoster    = "#404449"
hint       = "#3d4044"
gutter     = "#373a3e"
disabled   = "#3a3d41"
path       = "#45494e"
tree_caret = "#45494e"  # The file tree row's ▾/▸ caret


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Meaning and state (colour carries information here)
# ──────────────────────────────────────────────────────────────────────────────────────────────

# Status is the only place colour carries meaning in the rail.
[status]
ask           = "#bb914a"  # needs input
ask_bg        = "#352b1a"
fail          = "#b96057"
fail_bg       = "#35201f"
review        = "#5c9d77"
review_bg     = "#22372b"
run           = "#5c86b0"
run_bg        = "#212d38"
idle          = "#4f5459"
idle_bg       = "#232528"
ask_card_bg   = "#1c1914"
ask_card_edge = "#755c2f"
ask_card_fg   = "#a88954"
banner_bg     = "#1c1814"
banner_border = "#2f281e"

# Diff and change colours - added/removed line fills and signs, hunk headers, and the
# change-list stat bars.
[diff]
add_bg     = "#16211c"
add_fg     = "#8eb29d"
add_sign   = "#4d7961"
del_bg     = "#201819"
del_fg     = "#b4918d"
del_sign   = "#895954"
ctx_fg     = "#777b81"
hunk_bg    = "#17191d"
hunk_fg    = "#565b61"
fold_bg    = "#151618"
fold_fg    = "#45494e"
stat_add   = "#5b876e"  # "+142" label
stat_del   = "#94625d"  # "-8" label
stat_empty = "#232528"  # unused segment of the 5-bar
git_gutter = "#315742"  # 3px agent-touched marker

# Small status tags and the file tree's own A/M change marks.
[tag]
"new.fg"      = "#76aa8b"
"new.bg"      = "#22372b"
"deleted.fg"  = "#af7d78"
"deleted.bg"  = "#35201f"
"conflict.fg" = "#bb9c65"
"conflict.bg" = "#352b1a"
tree_added    = "#5b876e"  # "A" mark
tree_modified = "#8a7847"  # "M" mark

# Tokens used only by the Revision R12 rail rewrite (design_handoff_jerry_ade/revision 3/
# REVISION-2026-07-31.md §2) that have no exact match elsewhere in this module - every other
# colour that section calls for (the branch/note/model/activity greys, the amber flag, the
# spine/selection edges) already has one, reused directly at the call site rather than
# duplicated here under a second name.
[rail]
repo_header_name   = "#6b7075"
worktree_active_bg = "#1a1d1f"
worktree_hover_bg  = "#181a1d"  # Worktree row hover background (§2.2: "hover #16191c").
prunable_edge      = "#2e3236"

# One tint per agent.
[agent]
"sonnet.fg" = "#b49555"
"sonnet.bg" = "#2f2816"
"codex.fg"  = "#669e77"
"codex.bg"  = "#213028"
"haiku.fg"  = "#ab80a1"
"haiku.bg"  = "#30212d"
"local.fg"  = "#7586b0"
"local.bg"  = "#22283a"


# ──────────────────────────────────────────────────────────────────────────────────────────────
# The code surface
# ──────────────────────────────────────────────────────────────────────────────────────────────

# The editor's per-scope syntax palette - one ColorToken per tree-sitter-highlight capture
# bucket crate::code_surface::code_view::HighlightKind classifies a token into.
[syntax]
text                      = "#969aa1"
keyword                   = "#a584b2"
function                  = "#7095c0"
function_method           = "#7095c0"
function_definition       = "#8f8bbf"  # function.definition
type                      = "#a7905a"
type_builtin              = "#a7905a"
constant                  = "#b98566"
constant_builtin          = "#b98566"
string                    = "#859b69"
string_escape             = "#a3bb86"  # string.escape
number                    = "#b98566"
comment                   = "#7c8087"
comment_doc               = "#7c8087"  # comment.doc
variable                  = "#b77f97"  # variable
variable_parameter        = "#bc7f81"
variable_builtin          = "#b98566"  # variable.builtin (self/this/super/cls)
property                  = "#5b9db6"  # property (a field/attribute access
operator                  = "#64686e"  # operator (+, ==, &&, ...)
punctuation_bracket       = "#64686e"
punctuation_delimiter     = "#64686e"  # punctuation.delimiter (,/;/:/./::)
bracket_1                 = "#875764"
bracket_2                 = "#835f3f"
bracket_3                 = "#616d42"
bracket_4                 = "#37746a"
bracket_5                 = "#446c8a"
bracket_6                 = "#6f5e87"
tag                       = "#a7905a"
attribute                 = "#56a29a"
embedded                  = "#969aa1"
heading                   = "#a7905a"  # GitHub issue #104's own real, prose-specific buckets
link                      = "#7095c0"
strong                    = "#b7bbc2"  # text.strong (**bold**)
emphasis                  = "#a584b2"  # text.emphasis (*italic*)
punctuation_special       = "#64686e"
label                     = "#b77f97"
string_special            = "#859b69"
function_builtin          = "#7095c0"
function_macro            = "#7095c0"  # function.macro (Rust's println!-style macro invocations)
tag_error                 = "#a7905a"  # tag.error (HTML's mismatched/erroneous closing tag)
constructor               = "#a7905a"
caret                     = "#5483b7"
error_underline           = "#bd685f"  # 2px dotted
hover_underline           = "#6683a3"  # 1px solid
diagnostic_row_bg         = "#1a1618"
diagnostic_inline_message = "#a6736d"
diagnostic_card_message   = "#c6766d"

# The File view's structural chrome (GitHub issue #31's "editor chrome" checklist item) -
# selection, the current-line highlight, the caret, and a handful of tokens for editor features
# that are real schema slots but have **no real renderer yet** in this codebase
# (matching-bracket highlighting, indent guides inside the code surface itself - distinct from
# tree's file-*tree* indent guides, which are real and already painted -, whitespace marks, a
# minimap, blame text, and a removed-line gutter marker).
[editor]
selection           = "#5c86b0"  # The active text selection fill's base colour
selection_inactive  = "#5c86b0"
current_line        = "#1a1d20"  # The current-line highlight
caret               = "#5c86b0"  # The caret bar
matching_bracket    = "#304356"  # A matched/matching bracket pair's highlight fill.
indent_guide        = "#232528"
indent_guide_active = "#3f5264"  # The indent guide for the level the caret currently sits in.
whitespace          = "#3d4044"
minimap_bg          = "#161719"  # A minimap's own background fill.
gutter_text         = "#373a3e"  # The line-number gutter's text colour
gutter_text_active  = "#7b7f83"  # The current row's own brighter gutter-number colour
gutter_bg           = "#161719"  # The gutter column's own background fill.
blame_text          = "#606469"  # Inline git-blame annotation text.
diff_added          = "#315742"  # An added line's gutter marker
diff_removed        = "#895954"  # A removed line's own gutter marker.

# The terminal and agent CLI surface - prompt, output, its own status tones, and clickable path
# links.
[term]
prompt               = "#84a3c0"
text                 = "#92969b"
dim                  = "#606469"
ok                   = "#669e77"
err                  = "#b96057"
warn                 = "#b49555"
heading              = "#b2b6bb"
activity             = "#5c86b0"  # spinner / progress line
menu_sel_fg          = "#bb9c65"
menu_sel_bg          = "#1f1b14"
cursor               = "#5c86b0"
link                 = "#789bbd"
link_underline       = "#415e7b"
link_hover           = "#95b0c9"
link_underline_hover = "#7191ae"

# Exact colours for Surface C's real Completions popup item rows - read directly from
# design_handoff_jerry_ade/revision/Jerry.dc.html's own completions/KBG/KFG data (the sel ? ...
[completions_popup]
item_selected_bg   = "#283847"
item_selected_fg   = "#c3c7ca"
item_fg            = "#a0a5aa"
"kind_function.fg" = "#84a3c0"
"kind_function.bg" = "#283847"
"kind_variable.fg" = "#b49555"
"kind_variable.bg" = "#2f2816"
"kind_type.fg"     = "#a684b9"
"kind_type.bg"     = "#302237"


