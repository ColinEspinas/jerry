# Jerry theme template
#
# Copy this file - or click "New from template..." on Settings -> Themes, which writes this exact
# file for you - into ~/.config/jerry/themes/ and edit it. Lines starting with "#" are comments;
# keep or delete as many as you like.
#
# ──────────────────────────────────────────────────────────────────────────────────────────────
# How a Jerry theme works
# ──────────────────────────────────────────────────────────────────────────────────────────────
#
# Jerry's interface is painted from about 270 named colours, grouped into tables like [surface],
# [text] and [syntax]. A theme file names as many or as few of them as it likes. Anything it does
# NOT name is inherited from the theme in `base`, and ultimately from Jerry Dark's own built-in
# value.
#
# That has three consequences worth knowing up front:
#
#   * This file is a complete, valid theme even though it only sets a few dozen keys.
#   * Deleting a line is a real edit - that key simply goes back to what it inherited.
#   * New keys added by future Jerry versions inherit too, so a theme file never goes stale or
#     needs to be kept exhaustive.
#
# For the full list of every real key with a real value, open any bundled theme -
# assets/themes/slate.toml (or ember/moss/paper/jerry-dim) is a complete, commented palette, and
# copying one is the fastest way to author a whole theme rather than a few tweaks.
#
# ──────────────────────────────────────────────────────────────────────────────────────────────
# The rules
# ──────────────────────────────────────────────────────────────────────────────────────────────
#
#   name       Required. Must not reuse a built-in theme's name (Jerry Dark, Jerry Dim, Slate,
#              Ember, Moss, Paper).
#   subtitle   Optional. One line, shown under the name on the Themes page.
#   base       Optional. The theme every key you don't set is inherited from; "Jerry Dark" is the
#              usual choice, and omitting it means the same thing. A base chain that loops is
#              rejected with a real error naming the loop.
#   preview    Optional. Five "#rrggbb" colours for this theme's card. Omit it and the card is
#              painted from your own surface.window / surface.rail / status.review / status.ask /
#              status.run.
#
#   Colours are "#rrggbb" - a "#" and exactly six hex digits. No "#rgb" shorthand, no alpha, no
#   named CSS colours. An unknown table or key is rejected with an error naming it, so a typo
#   never silently does nothing.
#
#   Key names follow the source exactly: module name, then the constant name lowercased.
#   theme::surface::WINDOW is [surface] window. A few tokens are pairs or lists and use a quoted
#   dotted key, because TOML would otherwise read the dot as a nested table:
#
#       [agent]
#       "sonnet.fg" = "#d8a94a"
#       "sonnet.bg" = "#33280f"
#       [graph]
#       "lanes.0" = "#6b9bd1"
#
#   The one thing Jerry insists on: your text has to be legible. If body text or code ends up
#   effectively invisible against the surface behind it (below 1.6:1 contrast), the theme is
#   rejected with an error saying which pair failed. Nothing else about your colour choices is
#   second-guessed - flat designs that separate regions with borders rather than brightness are
#   perfectly fine.
#
#   Prefer a starting point over a blank page? Settings -> Themes -> "Generate from colour..."
#   takes one hex colour and writes a complete, literal, editable theme built around it.

name = "My Custom Theme"
subtitle = "replace this with a short description"
base = "Jerry Dark"


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Surfaces and structure
# ──────────────────────────────────────────────────────────────────────────────────────────────

# Backgrounds - every solid fill in the app, from the window itself down to popovers, hover
# states and keycaps.
[surface]
window       = "#0c0d10"  # window body
rail         = "#101216"  # left rail + right panel
center       = "#0f1013"  # work surface
card         = "#181a1e"  # composer, settings cards
popover      = "#1b1e24"  # completion popup, hover card
row_hover    = "#15181d"
row_selected = "#1b1f26"

# The 1px rules that separate things - zone edges, card and popover outlines, and the
# selected-row edge.
[border]
divider       = "#22262d"
card          = "#23282f"
selected_edge = "#e07a5f"  # 2px left edge on a selected row


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Text
# ──────────────────────────────────────────────────────────────────────────────────────────────

# The interface text ramp, brightest to dimmest. Not code: that is [syntax]. There are twelve
# levels in all - see any bundled theme for the rest.
[text]
primary = "#d6dae0"
body    = "#b9bfc7"
muted   = "#98a0a9"
faint   = "#6b7278"


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Meaning and state (colour carries information here)
# ──────────────────────────────────────────────────────────────────────────────────────────────

# Status is the only place colour carries meaning in the rail. Recolour these freely, but keep
# them telling four different stories - they are how an agent's state reads at a glance.
[status]
review = "#5cb87f"  # ready to review
ask    = "#e2a336"  # needs input
fail   = "#e07a5f"
run    = "#74ade8"


# ──────────────────────────────────────────────────────────────────────────────────────────────
# The code surface
# ──────────────────────────────────────────────────────────────────────────────────────────────

# Syntax highlighting. Every bucket is settable on its own; leave one out and it keeps the colour
# it inherits. Note that operators, brackets and delimiters deliberately render as plain text in
# Jerry's own themes - you can colour them here if you want to.
[syntax]
text               = "#b0b6c2"
keyword            = "#c98fbf"
function           = "#74ade8"
type               = "#dfc184"
string             = "#9dbb6f"
constant           = "#e07a5f"
comment            = "#5d636f"
variable           = "#bd89a5"
variable_parameter = "#bd566e"
property           = "#75b2c7"
