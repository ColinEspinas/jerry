# Paper - a bundled Jerry theme, and a worked example of the theme file format.
#
# GENERATED FILE. Every colour below was derived from Jerry Dark's own palette by the
# HSL transform in `crate::theme::derive_shift`, using this theme's five original
# swatches (#f4f1ea, #e4e0d6, #3f7a52, #a8752a, #3d6c9c), then written out literally - so it renders
# exactly as this theme always has while being an ordinary, hand-editable theme file
# with no special status.
#
# Regenerate with `crate::settings::builtin_themes` - see that module's docs.
#
# Every key below is optional. Anything this file does not name is inherited from the theme in
# `base`, and ultimately from Jerry Dark's own built-in value - so deleting a line is a real,
# supported edit, and a file that sets three keys is a complete theme. New keys added by future
# Jerry versions simply inherit too; nothing here has to be kept exhaustive.

name = "Paper"
subtitle = "light · beta"
base = "Jerry Dark"

# The five swatches this theme's card shows on the Themes page.
preview = ["#f4f1ea", "#e4e0d6", "#3f7a52", "#a8752a", "#3d6c9c"]


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Surfaces and structure
# ──────────────────────────────────────────────────────────────────────────────────────────────

# Backgrounds - every solid fill in the app, from the window itself down to popovers, hover
# states and keycaps.
[surface]
window                     = "#f0f1f4"  # window body
window_border              = "#cfd4d8"
title_bar                  = "#eceef0"
rail                       = "#edeff1"  # left rail + right panel
sidebar_strip              = "#f5f6f9"  # The sidebar strip's own recessed band (GitHub issue #291)
center                     = "#e8eaee"  # work surface
pty                        = "#eff2f4"  # agent CLI + terminal
header                     = "#e9ecef"  # context bar, panel headers
footer                     = "#eaedf0"  # surface footers, status strips
card                       = "#e1e6e9"  # composer, settings cards
card_sunk                  = "#e6eaed"  # card footers
popover                    = "#dee3e7"  # completion popup, hover card
palette                    = "#e4e7eb"
scrim                      = "#fbfcfe"  # at 62% alpha behind the palette
row_hover                  = "#e4e7eb"
row_hover_alt              = "#dbe0e3"  # hover on chrome buttons
row_selected               = "#dce1e4"
segment_track              = "#e1e5e8"
segment_active             = "#ced4d9"
keycap                     = "#dfe3e7"
keycap_hint                = "#e4e8ea"  # The hint-size keycap's own background
chip_neutral               = "#d2d7db"
current_line               = "#dee3e7"
title_bar_close_hover      = "#e04a4a"
menu_row_hover             = "#d7dde1"
menu_row_hover_destructive = "#f0dadc"
tab_close_hover            = "#d1d6da"  # A file tab's close-affordance hover fill
lsp_popover_footer         = "#e5e9eb"
runs_well                  = "#edeff2"  # The Changes panel's Runs section

# The 1px rules that separate things - zone edges, card and popover outlines, and the
# selected-row edge.
[border]
zone                   = "#d8dce0"  # between the three zones
inner                  = "#dadfe2"  # between bands inside a zone
rail_inner             = "#dfe3e6"
row                    = "#e2e5e7"  # change-list row separators
divider                = "#d3d8dc"  # 1px vertical rules
card                   = "#d1d6da"
card_field             = "#d2d7db"
composer               = "#cfd5da"
popover                = "#c5ccd2"
button                 = "#c9cfd4"  # outline button
button_disabled        = "#d7dbdf"
keycap                 = "#ccd2d7"
keycap_hint            = "#d2d7db"  # The hint-size keycap's own border
selected_edge          = "#90a9bf"  # 2px left edge on a selected row
diagnostic_card        = "#e6cbcd"  # The Diagnostic popover's own border.
diagnostic_card_footer = "#dfd5d7"  # The Diagnostic popover's own footer band's top border

# The Files tree's own structural marks (GitHub issue #18 §3).
[tree]
indent_guide        = "#d3d8dc"
indent_guide_active = "#90a9bf"

# The overlay scrollbar (GitHub issue #30).
[scrollbar]
thumb       = "#c6cdd3"
thumb_hover = "#b3bac1"


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Text
# ──────────────────────────────────────────────────────────────────────────────────────────────

# The interface text ramp, brightest to dimmest.
[text]
selected    = "#3b3e41"
primary     = "#414448"
heading     = "#484c4f"
strong      = "#4c5053"
body        = "#51565a"
secondary   = "#5b6065"
muted       = "#666b70"
dim         = "#73777c"
dimmer      = "#7c8287"
faint       = "#8c9197"
fainter     = "#979da2"
ghost       = "#a5abb0"
ghoster     = "#adb3b9"
hint        = "#b3b8bc"
gutter      = "#b9bec3"
disabled    = "#b6bbc1"
path        = "#a9aeb5"
tree_caret  = "#a9aeb5"  # The file tree row's ▾/▸ caret
glyph_hover = "#474b4f"


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Meaning and state (colour carries information here)
# ──────────────────────────────────────────────────────────────────────────────────────────────

# Status is the only place colour carries meaning in the rail.
[status]
ask           = "#805500"  # needs input
ask_bg        = "#daccb6"
fail          = "#b65553"
fail_bg       = "#eccdcd"
review        = "#377a4e"
review_bg     = "#b6d0be"
run           = "#4678a3"
run_bg        = "#c0d2e1"
idle          = "#9da3a9"
idle_bg       = "#d3d8dc"
ask_card_bg   = "#ece6de"
ask_card_edge = "#b08e5e"
ask_card_fg   = "#846127"
banner_bg     = "#ede7e0"
banner_border = "#dbd0c1"

# Diff and change colours - added/removed line fills and signs, hunk headers, and the
# change-list stat bars.
[diff]
add_bg     = "#d6e5dc"
add_fg     = "#395b46"
add_sign   = "#659375"
del_bg     = "#f0e1e4"
del_fg     = "#765351"
del_sign   = "#b47c79"
ctx_fg     = "#757b80"
hunk_bg    = "#e3e7ec"
hunk_fg    = "#959ba2"
fold_bg    = "#e9ecef"
fold_fg    = "#a9aeb5"
stat_add   = "#598669"  # "+142" label
stat_del   = "#ab7270"  # "-8" label
stat_empty = "#d3d8dc"  # unused segment of the 5-bar
git_gutter = "#8ab498"  # 3px agent-touched marker

# Git's own A/M/D status letters on a file row, and the file tree's own A/M change marks.
[tag]
status_added    = "#598669"  # A - a file git reports as added (STAGE-A-CHANGELOG.md §4j).
status_modified = "#82888d"  # M - a file git reports as modified.
status_deleted  = "#ab7270"  # D
tree_added      = "#598669"  # "A" mark
tree_modified   = "#907843"  # "M" mark

# Tokens the rail needs that have no exact match elsewhere in this module - every other colour
# it calls for (the branch/note/model/activity greys, the amber flag, the spine/selection edges)
# already has one, reused directly at the call site rather than duplicated here under a second
# name.
[rail]
repo_header_name   = "#666b70"  # Repo group header's uppercase name.
worktree_active_bg = "#dfe3e7"
worktree_hover_bg  = "#e3e6ea"  # Worktree row hover background (§2.2: "hover #16191c").
agent_title        = "#61656a"
repo_ask_count     = "#846127"  # The repo header's amber urgency **count**
repo_fail_count    = "#a66663"  # The repo header's red urgency **count**

# One tint per agent - the **agent tint pool**.
[agent]
"sonnet.fg" = "#945f3e"  # Copper - sonnet-4.5.
"sonnet.bg" = "#e7d5c4"  # Copper - sonnet-4.5.
"codex.fg"  = "#2e7a6e"  # Teal - gpt-5-codex.
"codex.bg"  = "#bfd9d4"  # Teal - gpt-5-codex.
"haiku.fg"  = "#6f669a"  # Periwinkle - haiku-4.5.
"haiku.bg"  = "#dbd7ed"  # Periwinkle - haiku-4.5.
"local.fg"  = "#586f99"  # Steel blue - qwen-local.
"local.bg"  = "#c7d3ec"  # Steel blue - qwen-local.

# The Changes panel - four stacked, collapsible sections in one scroller, plus the file row's
# own seen/unseen and discard states.
[changes]
edge_uncommitted      = "#90a9bf"  # UNCOMMITTED's 2px left edge - what is dirty in the checkout.
edge_neutral          = "#d3d8dc"  # COMMITS' 2px left edge.
edge_against_main     = "#80577b"  # AGAINST MAIN's 2px left edge
section_label         = "#666b70"  # Section header label - 9.5px/600 uppercase, .09em tracking.
section_count         = "#a9aeb5"  # Section header count
section_caret         = "#73777c"  # The section header's own disclosure caret (▾/▸).
run_meta_live         = "#9a8865"
run_meta_ended        = "#979da2"  # A run row's meta line once the run has ended
section_stat_add      = "#366948"  # The right-aligned per-section diffstat's +N, 10px mono.
section_stat_del      = "#a66663"  # The right-aligned per-section diffstat's −N, 10px mono.
filename_unseen       = "#3b3e41"  # A filename not seen since the agent last changed it
filename_seen         = "#82888d"  # A filename seen since the agent last changed it
shared_ring           = "#b08e5e"  # The ⚠ ring around a file row's author chips
hand_edit_gutter      = "#a5abb0"  # The you gutter bar in the diff view
hand_edit_chip_fg     = "#73777c"
hand_edit_chip_bg     = "#d2d7db"  # The you author chip's fill.
filter_bg             = "#d7dde1"
filter_hover_bg       = "#ced4d9"  # FILTER_BG's hover fill
discard_bg            = "#f0dadc"  # The armed Discard? pill's fill.
discard_border        = "#e8c0be"  # The armed Discard? pill's 1px border.
discard_fg            = "#975351"  # The armed Discard? pill's label.
hover_action_hover_bg = "#ced5dc"
discard_hover_bg      = "#f1d3d5"  # The discard button's hover fill

# Per-provider rate-limit budget - the meter on an agent tab and in the budget popover.
[budget]
ok       = "#366948"  # Above 40% remaining.
warn     = "#846127"  # 15-40% remaining.
critical = "#a66663"  # Below 15% remaining.
track    = "#d3d8dc"  # The unfilled remainder of the meter
stale    = "#8c9197"

# Diff-line review notes (GitHub issue #288, STAGE-A-CHANGELOG.md §1's two §6.2 rows and the
# audit's top-5 #2) - the notes bar above the hunks and the card pinned beneath a line.
[notes]
edge             = "#4678a3"
card_bg          = "#e0e6eb"  # The pinned card's fill.
card_border      = "#b2c3d5"
card_fg          = "#4c5053"  # The card's own note text.
card_placeholder = "#979da2"  # The placeholder shown in an empty, still-being-typed card.
mark_draft       = "#4b6c87"  # A card's draft mark
mark_sent        = "#366948"  # A card's sent mark, and the bar's own ✓ sent confirmation.
dot              = "#3b5e7a"
dot_empty        = "#b9bec3"  # The same column's ○
bar_bg           = "#dfe6ed"  # The notes bar's band.
bar_border       = "#bfcfde"  # Its 1px bottom rule against the hunks below it.
bar_label        = "#355269"  # The bar's count sentence (1 note on this file).
bar_meta         = "#979da2"
bar_error        = "#a66663"
send_bg          = "#d1dde8"
send_border      = "#8babc4"  # Its 1px border, and its keycaps' border.
send_hover_bg    = "#c4d4e1"  # Its hover fill.
send_fg          = "#355269"  # Its label.
send_cap_fg      = "#4b6c87"  # Its ⌘⏎ keycaps' glyphs.

# Agent history - the sidebar's run list and the run-transcript tab (GitHub issue #227).
[history]
out_done_fg        = "#366948"  # done - its last turn ended cleanly and Jerry watched it end.
out_done_bg        = "#d0e0d6"
out_interrupted_fg = "#846127"  # interrupted
out_interrupted_bg = "#dfd7c7"
out_failed_fg      = "#a66663"  # failed - its last real signal was a failure.
out_failed_bg      = "#f0dadc"
out_abandoned_fg   = "#73777c"  # abandoned - nobody ever saw it end.
out_abandoned_bg   = "#d8dce0"
drift_tip          = "#377a4e"  # Drift dot, 0 commits since - at the tip.
drift_near         = "#3b5e7a"  # Drift dot, 1-2 commits since.
drift_far          = "#846127"  # Drift dot, 3+ commits since.
drift_text         = "#979da2"
drift_far_text     = "#907843"
scope_on_bg        = "#d7dde1"  # The scope toggle's selected segment
scope_on_border    = "#c6cdd4"
scope_on_fg        = "#4c5053"
scope_off_fg       = "#979da2"
scope_hover_bg     = "#dbe0e3"
repo_label         = "#666b70"
group_label        = "#5b6065"
row_title          = "#4c5053"  # A run row's title when the row is not the open one.
transcript_prompt  = "#3b5e7a"  # The transcript body's four line tones
transcript_body    = "#5e6267"
transcript_detail  = "#8c9197"
transcript_lead    = "#43474b"
resume_bg          = "#b7d1c0"  # The run-transcript footer's Resume here button
resume_bg_hover    = "#9dc1ab"
resume_border      = "#83ac90"
resume_fg          = "#2c573c"

# The right panel's Search tab (GitHub issue #162, REVISION-2026-08-14.md §5 /
# STAGE-A-CHANGELOG.md §4v) - real hex values transcribed directly from those sections, not
# paraphrased.
[search]
modifier_on_bg = "#bbd0e0"  # A modifier button's active fill
modifier_on_fg = "#355269"  # That button's glyph while it is on.
match_bg       = "#b2c3d5"
match_fg       = "#355269"  # The matched text itself.
line           = "#82888d"


# ──────────────────────────────────────────────────────────────────────────────────────────────
# The code surface
# ──────────────────────────────────────────────────────────────────────────────────────────────

# The editor's per-scope syntax palette - one ColorToken per tree-sitter-highlight capture
# bucket crate::code_surface::code_view::HighlightKind classifies a token into.
[syntax]
text                      = "#5a5e65"
keyword                   = "#755687"
function                  = "#3c6892"
function_method           = "#3c6892"
function_definition       = "#5e5e93"  # function.definition
type                      = "#7c6026"
type_builtin              = "#7c6026"
constant                  = "#8c5539"
constant_builtin          = "#8c5539"
string                    = "#5b6d35"
string_escape             = "#415218"  # string.escape
number                    = "#8c5539"
comment                   = "#656a71"
comment_doc               = "#656a71"  # comment.doc
comment_doc_tag           = "#755687"  # GitHub issue #200's own doc-comment tag bucket
variable                  = "#87506d"  # variable
variable_parameter        = "#8e5057"
variable_builtin          = "#8c5539"  # variable.builtin (self/this/super/cls)
property                  = "#1b6f86"  # property (a field/attribute access
operator                  = "#81878e"  # operator (+, ==, &&, ...)
punctuation_bracket       = "#81878e"
punctuation_delimiter     = "#81878e"  # punctuation.delimiter (,/;/:/./::)
bracket_1                 = "#ad7789"
bracket_2                 = "#a97d5d"
bracket_3                 = "#818b59"
bracket_4                 = "#509284"
bracket_5                 = "#5b8bac"
bracket_6                 = "#8d7fae"
tag                       = "#7c6026"
attribute                 = "#177469"
embedded                  = "#5a5e65"
heading                   = "#7c6026"  # GitHub issue #104's own real, prose-specific buckets
link                      = "#3c6892"
strong                    = "#3e4349"  # text.strong (**bold**)
emphasis                  = "#755687"  # text.emphasis (*italic*)
punctuation_special       = "#81878e"
label                     = "#87506d"
string_special            = "#5b6d35"
function_builtin          = "#3c6892"
function_macro            = "#3c6892"  # function.macro (Rust's println!-style macro invocations)
tag_error                 = "#7c6026"  # tag.error (HTML's mismatched/erroneous closing tag)
constructor               = "#7c6026"
caret                     = "#326da2"
error_underline           = "#a84e4c"  # 2px dotted
hover_underline           = "#4b6c8d"  # 1px solid
diagnostic_row_bg         = "#ede7ea"
diagnostic_inline_message = "#915b59"
diagnostic_card_message   = "#8c504f"  # The Diagnostic state's card message headline.

# The File view's structural chrome (GitHub issue #31's "editor chrome" checklist item) -
# selection, the current-line highlight, the caret, and a handful of tokens for editor features
# that are real schema slots but have **no real renderer yet** in this codebase
# (matching-bracket highlighting, indent guides inside the code surface itself - distinct from
# tree's file-*tree* indent guides, which are real and already painted -, whitespace marks, a
# minimap, blame text, and a removed-line gutter marker).
[editor]
selection           = "#4678a3"  # The active text selection fill's base colour
selection_inactive  = "#4678a3"
current_line        = "#dee3e7"  # The current-line highlight
caret               = "#4678a3"  # The caret bar
matching_bracket    = "#9ebad0"  # A matched/matching bracket pair's highlight fill.
indent_guide        = "#d3d8dc"
indent_guide_active = "#90a9bf"  # The indent guide for the level the caret currently sits in.
whitespace          = "#b3b8bc"
minimap_bg          = "#e8eaee"  # A minimap's own background fill.
gutter_text         = "#b9bec3"  # The line-number gutter's text colour
gutter_text_active  = "#73777c"  # The current row's own brighter gutter-number colour
gutter_bg           = "#e8eaee"  # The gutter column's own background fill.
blame_text          = "#8c9197"  # Inline git-blame annotation text.
diff_added          = "#8ab498"  # An added line's gutter marker
diff_removed        = "#b47c79"  # A removed line's own gutter marker.

# The terminal and agent CLI surface - prompt, output, its own status tones, and clickable path
# links.
[term]
prompt               = "#3b5e7a"
text                 = "#5e6267"
dim                  = "#8c9197"
ok                   = "#3e764a"
err                  = "#b65553"
warn                 = "#7b5702"
heading              = "#43474b"
activity             = "#4678a3"  # spinner / progress line
menu_sel_fg          = "#735111"
menu_sel_bg          = "#e9e3d8"
cursor               = "#4678a3"
link                 = "#3c6586"
link_underline       = "#789ebf"
link_hover           = "#355269"
link_underline_hover = "#486e8a"

# The integrated terminal's own rendered-content palette - the colours a program running inside
# a terminal pane actually paints its characters with.
[terminal]
background     = "#eff2f4"  # The terminal pane's own fill
foreground     = "#5e6267"  # Unstyled output
cursor         = "#4678a3"  # What NamedColor::Cursor resolves to
selection      = "#b4c7d9"  # The fill painted behind a selected cell
spawn_error    = "#ad3f44"
process_exited = "#5c4000"  # The process exited label, once the child is gone.
"ansi.0"       = "#000000"
"ansi.1"       = "#cd3131"
"ansi.2"       = "#00bc00"
"ansi.3"       = "#949800"
"ansi.4"       = "#0451a5"
"ansi.5"       = "#bc05bc"
