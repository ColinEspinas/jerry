# The environment (WSL) chip's tokens - shown in the terminal footer, the status bar, and
# Settings' Default environment row.
[env]
wsl_fg       = "#3b5e7a"
wsl_bg       = "#d2dfe9"
wsl_border   = "#b5c9db"
local_fg     = "#8c9197"  # Defaults to text::FAINT's own value.
local_border = "#d3d8dc"  # Defaults to border::DIVIDER's own value.

# Language chips, shared by the file tree, the code tab and the palette.
[lang]
"rs.fg"      = "#9a6941"  # "rs"
"rs.bg"      = "#e5d6c8"  # "rs"
"toml.fg"    = "#73777c"  # "to"
"toml.bg"    = "#d2d7db"  # "to"
"md.fg"      = "#586f99"  # "md"
"md.bg"      = "#d0d9e7"  # "md"
"sql.fg"     = "#3e764a"  # "sq"
"sql.bg"     = "#cddbd0"  # "sq"
"ts.fg"      = "#4e759d"  # "ts"
"ts.bg"      = "#c9d7e8"  # "ts"
"vue.fg"     = "#377a4e"  # "vue"
"vue.bg"     = "#d0e0d6"  # "vue"
"py.fg"      = "#715d01"  # "py"
"py.bg"      = "#dcd7c4"  # "py"
"go.fg"      = "#3e768a"  # "go"
"go.bg"      = "#cadce5"  # "go"
"json.fg"    = "#54575c"  # "jsn"
"json.bg"    = "#d4d7dc"  # "jsn"
"yaml.fg"    = "#516985"  # "yml"
"yaml.bg"    = "#d0dae6"  # "yml"
"c.fg"       = "#736a98"  # "c"
"c.bg"       = "#dbd8eb"  # "c"
"html.fg"    = "#a85f52"  # "htm"
"html.bg"    = "#ead6d1"  # "htm"
"css.fg"     = "#8f5c82"  # "css"
"css.bg"     = "#e4d5e1"  # "css"
"unknown.fg" = "#8c9197"
"unknown.bg" = "#d2d7db"

# The status bar's three type tiers.
[status_bar]
primary       = "#5b6065"  # Tier 1
secondary     = "#7c8287"  # Tier 2
recessive     = "#a9aeb5"  # Tier 3
divider       = "#c6cdd3"  # The 1px, 13-high rules between tiers.
section_label = "#9a9fa4"
meter_track   = "#d1d6da"
load_neutral  = "#979da2"
load_elevated = "#846127"  # 60% < load <= 85%.
load_critical = "#a66663"  # load > 85%.
