# Jerry Dark - this app's default theme, and the base every other theme inherits from.
#
# This file deliberately names no colours: every one of Jerry Dark's ~270 values is the
# compiled-in default of the matching token, so restating them here would just be a
# second copy to keep in sync. Copy any other bundled theme instead if you want a full
# palette to start from.
#
# Generated by `crate::settings::builtin_themes` - see that module's docs to regenerate.
#
# Every key below is optional. Anything this file does not name is inherited from the theme in
# `base`, and ultimately from Jerry Dark's own built-in value - so deleting a line is a real,
# supported edit, and a file that sets three keys is a complete theme. New keys added by future
# Jerry versions simply inherit too; nothing here has to be kept exhaustive.

name = "Jerry Dark"
subtitle = "default"

# The five swatches this theme's card shows on the Themes page.
preview = ["#0e0f11", "#1a1e21", "#5cb87f", "#e2a336", "#74ade8"]
