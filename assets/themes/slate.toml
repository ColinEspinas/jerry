[settings]
nav_row_hover           = "#17191a"
subtitle                = "#5c6065"
card_row_sep            = "#1d2023"
agent_ready             = "#488b64"  # A binary-found status dot on the Agents page.
agent_not_found         = "#ba4136"  # A binary-not-found status dot on the Agents page
worktree_prunable_dot   = "#34383c"  # The Worktrees page's "merged and prunable" row dot
card_selected_bg        = "#161a1d"
card_unselected_bg      = "#141619"
theme_card_hover_border = "#31353a"
snippet_section         = "#9b58bf"

# Palette-only (⌘P) colours read directly from Jerry.dc.html's inline literals for the
# paletteOpen block - real values missing from tokens.rs's transcription (predates the palette
# section).
[palette]
