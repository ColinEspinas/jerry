# Slate - a bundled Jerry theme, and a worked example of the theme file format.
#
# GENERATED FILE. Every colour below was derived from Jerry Dark's own palette by the
# HSL transform in `crate::theme::derive_shift`, using this theme's five original
# swatches (#0d1117, #161b22, #57a773, #c9a227, #6b9bd1), then written out literally - so it renders
# exactly as this theme always has while being an ordinary, hand-editable theme file
# with no special status.
#
# Regenerate with `crate::settings::builtin_themes` - see that module's docs.
#
# Every key below is optional. Anything this file does not name is inherited from the theme in
# `base`, and ultimately from Jerry Dark's own built-in value - so deleting a line is a real,
# supported edit, and a file that sets three keys is a complete theme. New keys added by future
# Jerry versions simply inherit too; nothing here has to be kept exhaustive.

name = "Slate"
subtitle = "cool greys"
base = "Jerry Dark"

# The five swatches this theme's card shows on the Themes page.
preview = ["#0d1117", "#161b22", "#57a773", "#c9a227", "#6b9bd1"]


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Surfaces and structure
# ──────────────────────────────────────────────────────────────────────────────────────────────

# Backgrounds - every solid fill in the app, from the window itself down to popovers, hover
# states and keycaps.
[surface]
window                = "#101113"  # window body
window_border         = "#202327"
title_bar             = "#111315"
rail                  = "#111214"  # left rail + right panel
center                = "#131518"  # work surface
pty                   = "#0f1113"  # agent CLI + terminal
header                = "#131417"  # context bar, panel headers
footer                = "#121316"  # surface footers, status strips
card                  = "#15181b"  # composer, settings cards
card_sunk             = "#131619"  # card footers
popover               = "#161a1e"  # completion popup, hover card
palette               = "#14171a"
scrim                 = "#0a0b0c"  # at 62% alpha behind the palette
row_hover             = "#14171a"
row_hover_alt         = "#181c1f"  # hover on chrome buttons
row_selected          = "#181b1e"
segment_track         = "#16181b"
segment_active        = "#1e2328"
keycap                = "#161a1d"
keycap_hint           = "#141719"  # The hint-size keycap's own background
chip_neutral          = "#1e2125"
current_line          = "#161a1e"
title_bar_close_hover = "#a81300"
menu_row_hover        = "#1a1e22"
tab_close_hover       = "#1e2226"  # A file tab's close-affordance hover fill

# The 1px rules that separate things - zone edges, card and popover outlines, and the
# selected-row edge.
[border]
zone            = "#1a1e21"  # between the three zones
inner           = "#191c1f"  # between bands inside a zone
rail_inner      = "#171a1d"
row             = "#16181a"  # change-list row separators
divider         = "#1d2024"  # 1px vertical rules
card            = "#1e2226"
card_field      = "#1d2125"
composer        = "#1e2227"
popover         = "#23282e"
button          = "#22262b"  # outline button
button_disabled = "#1b1e22"
keycap          = "#202429"
keycap_hint     = "#1e2125"  # The hint-size keycap's own border
selected_edge   = "#2d435b"  # 2px left edge on a selected row

# The Files tree's own structural marks (GitHub issue #18 §3).
[tree]
indent_guide        = "#1d2024"
indent_guide_active = "#2d435b"  # The guide for a level in the selected file's ancestor chain

# The overlay scrollbar's own colours (GitHub issue #30) - not from design_handoff_jerry_ade
# (that mockup has no scrollbar spec at all: every scrollable region there relies on raw,
# invisible browser/OS scrolling), so these are a deliberate, judgment-call derivation from
# existing neutral tokens rather than a transcription.
[scrollbar]
thumb       = "#2d3136"
thumb_hover = "#3f454b"


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Text
# ──────────────────────────────────────────────────────────────────────────────────────────────

# The interface text ramp, brightest to dimmest.
[text]
selected   = "#979a9f"
primary    = "#909499"
heading    = "#898d92"
strong     = "#85898e"
body       = "#7f848b"
secondary  = "#757a81"
muted      = "#6b7177"
dim        = "#62666c"
dimmer     = "#595e65"
faint      = "#4d5258"
fainter    = "#45494f"
ghost      = "#3a3f45"
ghoster    = "#34393f"
hint       = "#32363a"
gutter     = "#2d3136"
disabled   = "#2f3339"
path       = "#383c43"
tree_caret = "#383c43"  # The file tree row's ▾/▸ caret


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Meaning and state (colour carries information here)
# ──────────────────────────────────────────────────────────────────────────────────────────────

# Status is the only place colour carries meaning in the rail.
[status]
ask           = "#9e7200"  # needs input
ask_bg        = "#2f240d"
fail          = "#aa3b2d"
fail_bg       = "#321917"
review        = "#208559"
review_bg     = "#133023"
run           = "#396ba2"
run_bg        = "#192635"
idle          = "#3f454b"
idle_bg       = "#1d2024"
ask_card_bg   = "#1a160f"
ask_card_edge = "#664900"
ask_card_fg   = "#8f6c1d"
banner_bg     = "#1a1610"
banner_border = "#2a2214"

# Diff and change colours - added/removed line fills and signs, hunk headers, and the
# change-list stat bars.
[diff]
add_bg     = "#0f1e18"
add_fg     = "#63927b"
add_sign   = "#28674b"
del_bg     = "#1f1415"
del_fg     = "#9a7069"
del_sign   = "#7c4139"
ctx_fg     = "#5e646a"
hunk_bg    = "#15171b"
hunk_fg    = "#454b52"
fold_bg    = "#131417"
fold_fg    = "#383c43"
stat_add   = "#347155"  # "+142" label
stat_del   = "#854840"  # "-8" label
stat_empty = "#1d2024"  # unused segment of the 5-bar
git_gutter = "#124b34"  # 3px agent-touched marker

# Small status tags and the file tree's own A/M change marks.
[tag]
"new.fg"      = "#468e6b"
"new.bg"      = "#133023"
"deleted.fg"  = "#9a5e55"
"deleted.bg"  = "#321917"
"conflict.fg" = "#9e7b2d"
"conflict.bg" = "#2f240d"
tree_added    = "#347155"  # "A" mark
tree_modified = "#746019"  # "M" mark

# Tokens used only by the Revision R12 rail rewrite (design_handoff_jerry_ade/revision 3/
# REVISION-2026-07-31.md §2) that have no exact match elsewhere in this module - every other
# colour that section calls for (the branch/note/model/activity greys, the amber flag, the
# spine/selection edges) already has one, reused directly at the call site rather than
# duplicated here under a second name.
[rail]
repo_header_name   = "#555b61"
worktree_active_bg = "#161a1d"
worktree_hover_bg  = "#15181b"  # Worktree row hover background (§2.2: "hover #16191c").
prunable_edge      = "#262a2f"

# One tint per agent.
[agent]
"sonnet.fg" = "#99760b"
"sonnet.bg" = "#2a220a"
"codex.fg"  = "#338557"
"codex.bg"  = "#162b21"
"haiku.fg"  = "#955f86"
"haiku.bg"  = "#2d1a28"
"local.fg"  = "#596a9f"
"local.bg"  = "#1b2238"


# ──────────────────────────────────────────────────────────────────────────────────────────────
# The code surface
# ──────────────────────────────────────────────────────────────────────────────────────────────

# The editor's per-scope syntax palette - one ColorToken per tree-sitter-highlight capture
# bucket crate::code_surface::code_view::HighlightKind classifies a token into.
[syntax]
text                      = "#7a7f88"
keyword                   = "#9c6ea7"
function                  = "#5581b8"
function_method           = "#5581b8"
function_definition       = "#7f77b8"  # function.definition
type                      = "#967c31"
type_builtin              = "#967c31"
constant                  = "#ae7045"
constant_builtin          = "#ae7045"
string                    = "#688848"
string_escape             = "#799a58"  # string.escape
number                    = "#ae7045"
comment                   = "#797f87"
comment_doc               = "#797f87"  # comment.doc
variable                  = "#b06986"  # variable
variable_parameter        = "#b5696a"
variable_builtin          = "#ae7045"  # variable.builtin (self/this/super/cls)
property                  = "#2b88a9"  # property (a field/attribute access
operator                  = "#5e636b"  # operator (+, ==, &&, ...)
punctuation_bracket       = "#5e636b"
punctuation_delimiter     = "#5e636b"  # punctuation.delimiter (,/;/:/./::)
bracket_1                 = "#8e505f"
bracket_2                 = "#85592c"
bracket_3                 = "#576930"
bracket_4                 = "#196e65"
bracket_5                 = "#34678f"
bracket_6                 = "#70588c"
tag                       = "#967c31"
attribute                 = "#128d88"
embedded                  = "#7a7f88"
heading                   = "#967c31"  # GitHub issue #104's own real, prose-specific buckets
link                      = "#5581b8"
strong                    = "#90959e"  # text.strong (**bold**)
emphasis                  = "#9c6ea7"  # text.emphasis (*italic*)
caret                     = "#4881c5"
error_underline           = "#ca5d4f"  # 2px dotted
hover_underline           = "#5f81ab"  # 1px solid
diagnostic_row_bg         = "#191415"
diagnostic_inline_message = "#ae6e64"
diagnostic_card_message   = "#c56152"

# The File view's structural chrome (GitHub issue #31's "editor chrome" checklist item) -
# selection, the current-line highlight, the caret, and a handful of tokens for editor features
# that are real schema slots but have **no real renderer yet** in this codebase
# (matching-bracket highlighting, indent guides inside the code surface itself - distinct from
# tree's file-*tree* indent guides, which are real and already painted -, whitespace marks, a
# minimap, blame text, and a removed-line gutter marker).
[editor]
selection           = "#396ba2"  # The active text selection fill's base colour
selection_inactive  = "#396ba2"
current_line        = "#161a1e"  # The current-line highlight
caret               = "#396ba2"  # The caret bar
matching_bracket    = "#203850"  # A matched/matching bracket pair's highlight fill.
indent_guide        = "#1d2024"
indent_guide_active = "#2d435b"  # The indent guide for the level the caret currently sits in.
whitespace          = "#32363a"
minimap_bg          = "#131518"  # A minimap's own background fill.
gutter_text         = "#2d3136"  # The line-number gutter's text colour
gutter_text_active  = "#62666c"  # The current row's own brighter gutter-number colour
gutter_bg           = "#131518"  # The gutter column's own background fill.
blame_text          = "#4d5258"  # Inline git-blame annotation text.
diff_added          = "#124b34"  # An added line's gutter marker
diff_removed        = "#7c4139"  # A removed line's own gutter marker.

# The terminal and agent CLI surface - prompt, output, its own status tones, and clickable path
# links.
[term]
prompt               = "#5e83a9"
text                 = "#74787f"
dim                  = "#4d5258"
ok                   = "#338557"
err                  = "#aa3b2d"
warn                 = "#99760b"
heading              = "#8d9197"
activity             = "#396ba2"  # spinner / progress line
menu_sel_fg          = "#9e7b2d"
menu_sel_bg          = "#1c180f"
cursor               = "#396ba2"
link                 = "#537da8"
link_underline       = "#294d72"
link_hover           = "#6e8dae"
link_underline_hover = "#4f759b"

# Exact colours for Surface C's real Completions popup item rows - read directly from
# design_handoff_jerry_ade/revision/Jerry.dc.html's own completions/KBG/KFG data (the sel ? ...
[completions_popup]
item_selected_bg   = "#1c2f42"
item_selected_fg   = "#9a9ea3"
item_fg            = "#7f848b"
"kind_function.fg" = "#5e83a9"
"kind_function.bg" = "#1c2f42"
"kind_variable.fg" = "#99760b"
"kind_variable.bg" = "#2a220a"
"kind_type.fg"     = "#9061a2"
"kind_type.bg"     = "#2d1934"


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Chrome and widgets
# ──────────────────────────────────────────────────────────────────────────────────────────────

# Buttons, by role: green (primary/confirm), blue (secondary), amber (attention) and the danger
