# Slate - a bundled Jerry theme, and a worked example of the theme file format.
#
# GENERATED FILE. Every colour below was derived from Jerry Dark's own palette by the
# HSL transform in `crate::theme::derive_shift`, using this theme's five original
# swatches (#0d1117, #161b22, #57a773, #c9a227, #6b9bd1), then written out literally - so it renders
# exactly as this theme always has while being an ordinary, hand-editable theme file
# with no special status.
#
# Regenerate with `crate::settings::builtin_themes` - see that module's docs.
#
# Every key below is optional. Anything this file does not name is inherited from the theme in
# `base`, and ultimately from Jerry Dark's own built-in value - so deleting a line is a real,
# supported edit, and a file that sets three keys is a complete theme. New keys added by future
# Jerry versions simply inherit too; nothing here has to be kept exhaustive.

name = "Slate"
subtitle = "cool greys"
base = "Jerry Dark"

# The five swatches this theme's card shows on the Themes page.
preview = ["#0d1117", "#161b22", "#57a773", "#c9a227", "#6b9bd1"]


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Surfaces and structure
# ──────────────────────────────────────────────────────────────────────────────────────────────

# Backgrounds - every solid fill in the app, from the window itself down to popovers, hover
# states and keycaps.
[surface]
window                = "#111113"  # window body
window_border         = "#222528"
title_bar             = "#121416"
rail                  = "#121315"  # left rail + right panel
center                = "#141618"  # work surface
pty                   = "#101114"  # agent CLI + terminal
header                = "#131518"  # context bar, panel headers
footer                = "#131417"  # surface footers, status strips
card                  = "#16191c"  # composer, settings cards
card_sunk             = "#141619"  # card footers
popover               = "#181b1e"  # completion popup, hover card
palette               = "#16181b"
scrim                 = "#0b0c0d"  # at 62% alpha behind the palette
row_hover             = "#16181b"
row_hover_alt         = "#1a1d1f"  # hover on chrome buttons
row_selected          = "#191c1f"
segment_track         = "#17191c"
segment_active        = "#212529"
keycap                = "#181b1d"
keycap_hint           = "#16181a"  # The hint-size keycap's own background
chip_neutral          = "#202326"
current_line          = "#181b1e"
title_bar_close_hover = "#a31d23"
menu_row_hover        = "#1b1f22"
tab_close_hover       = "#202326"  # A file tab's close-affordance hover fill

# The 1px rules that separate things - zone edges, card and popover outlines, and the
# selected-row edge.
[border]
zone            = "#1c1f21"  # between the three zones
inner           = "#1b1e20"  # between bands inside a zone
rail_inner      = "#191b1d"
row             = "#17191b"  # change-list row separators
divider         = "#1f2225"  # 1px vertical rules
card            = "#202326"
card_field      = "#1f2326"
composer        = "#212428"
popover         = "#262a2f"
button          = "#25282c"  # outline button
button_disabled = "#1d2023"
keycap          = "#23262a"
keycap_hint     = "#202326"  # The hint-size keycap's own border
selected_edge   = "#364758"  # 2px left edge on a selected row

# The Files tree's own structural marks (GitHub issue #18 §3).
[tree]
indent_guide        = "#1f2225"
indent_guide_active = "#364758"  # The guide for a level in the selected file's ancestor chain

# The overlay scrollbar's own colours (GitHub issue #30) - not from design_handoff_jerry_ade
# (that mockup has no scrollbar spec at all: every scrollable region there relies on raw,
# invisible browser/OS scrolling), so these are a deliberate, judgment-call derivation from
# existing neutral tokens rather than a transcription.
[scrollbar]
thumb       = "#313437"
thumb_hover = "#45494e"


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Text
# ──────────────────────────────────────────────────────────────────────────────────────────────

# The interface text ramp, brightest to dimmest.
[text]
selected   = "#9ca7b4"
primary    = "#97a0ab"
heading    = "#9199a2"
strong     = "#8d949d"
body       = "#858f99"
secondary  = "#7c848d"
muted      = "#737981"
dim        = "#6a6e73"
dimmer     = "#61656a"
faint      = "#54575c"
fainter    = "#4b4e52"
ghost      = "#3f4347"
ghoster    = "#393c40"
hint       = "#36393c"
gutter     = "#313437"
disabled   = "#33363a"
path       = "#3c4045"
tree_caret = "#3c4045"  # The file tree row's ▾/▸ caret


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Meaning and state (colour carries information here)
# ──────────────────────────────────────────────────────────────────────────────────────────────

# Status is the only place colour carries meaning in the rail.
[status]
ask           = "#ac812a"  # needs input
ask_bg        = "#312715"
fail          = "#ba4136"
fail_bg       = "#301d1c"
review        = "#488b64"
review_bg     = "#1c3126"
run           = "#3c71a9"
run_bg        = "#1d2833"
idle          = "#45494e"
idle_bg       = "#1f2225"
ask_card_bg   = "#1c1812"
ask_card_edge = "#665021"
ask_card_fg   = "#997a3c"
banner_bg     = "#1b1712"
banner_border = "#2c2519"

# Diff and change colours - added/removed line fills and signs, hunk headers, and the
# change-list stat bars.
[diff]
add_bg     = "#131f1a"
add_fg     = "#69ab85"
add_sign   = "#416853"
del_bg     = "#1f1517"
del_fg     = "#b17068"
del_sign   = "#784f4b"
ctx_fg     = "#666b71"
hunk_bg    = "#16181b"
hunk_fg    = "#4b4f55"
fold_bg    = "#131518"
fold_fg    = "#3c4045"
stat_add   = "#4d745f"  # "+142" label
stat_del   = "#86544f"  # "-8" label
stat_empty = "#1f2225"  # unused segment of the 5-bar
git_gutter = "#284b39"  # 3px agent-touched marker

# Small status tags and the file tree's own A/M change marks.
[tag]
"new.fg"      = "#54a375"
"new.bg"      = "#1c3126"
"deleted.fg"  = "#af5d54"
"deleted.bg"  = "#301d1c"
"conflict.fg" = "#bd9138"
"conflict.bg" = "#312715"
tree_added    = "#4d745f"  # "A" mark
tree_modified = "#776838"  # "M" mark

# Tokens used only by the Revision R12 rail rewrite (design_handoff_jerry_ade/revision 3/
# REVISION-2026-07-31.md §2) that have no exact match elsewhere in this module - every other
# colour that section calls for (the branch/note/model/activity greys, the amber flag, the
# spine/selection edges) already has one, reused directly at the call site rather than
# duplicated here under a second name.
[rail]
repo_header_name   = "#5d6166"
worktree_active_bg = "#181b1d"
worktree_hover_bg  = "#16191b"  # Worktree row hover background (§2.2: "hover #16191c").
prunable_edge      = "#292c30"

# One tint per agent.
[agent]
"sonnet.fg" = "#a88735"
"sonnet.bg" = "#2c2511"
"codex.fg"  = "#4e8f62"
"codex.bg"  = "#1c2b23"
"haiku.fg"  = "#a55e96"
"haiku.bg"  = "#2b1e29"
"local.fg"  = "#4d69b3"
"local.bg"  = "#1d2335"


# ──────────────────────────────────────────────────────────────────────────────────────────────
# The code surface
# ──────────────────────────────────────────────────────────────────────────────────────────────

# The editor's per-scope syntax palette - one ColorToken per tree-sitter-highlight capture
# bucket crate::code_surface::code_view::HighlightKind classifies a token into.
[syntax]
text                      = "#7c8394"
keyword                   = "#924bab"
function                  = "#3b7ccb"
function_method           = "#3b7ccb"
type                      = "#c09e4c"
type_builtin              = "#c09e4c"
constant                  = "#96744c"
constant_builtin          = "#96744c"
string                    = "#769250"
string_escape             = "#95b661"  # string.escape
number                    = "#96744c"
comment                   = "#4a4d56"
comment_doc               = "#60636e"  # comment.doc
variable                  = "#985f7b"  # variable
variable_parameter        = "#8f4452"
variable_builtin          = "#96744c"  # variable.builtin (self/this/super/cls)
property                  = "#4f89a1"  # property (a field/attribute access
operator                  = "#7c8394"  # operator (+, ==, &&, ...)
punctuation_bracket       = "#7c8394"
punctuation_delimiter     = "#7c8394"  # punctuation.delimiter (,/;/:/./::)
bracket_1                 = "#27b6af"
bracket_2                 = "#8f2ac7"
bracket_3                 = "#309c33"
bracket_4                 = "#af4a3e"
bracket_5                 = "#2662a5"
bracket_6                 = "#b4a52d"
tag                       = "#c09e4c"
attribute                 = "#5b918c"
embedded                  = "#7c8394"
heading                   = "#c09e4c"  # GitHub issue #104's own real, prose-specific buckets
link                      = "#3b7ccb"
strong                    = "#939fb5"  # text.strong (**bold**)
emphasis                  = "#9f6db4"  # text.emphasis (*italic*)
caret                     = "#3c71a9"
error_underline           = "#ba4136"  # 2px dotted
hover_underline           = "#425d7b"  # 1px solid
diagnostic_row_bg         = "#191516"
diagnostic_inline_message = "#523e3c"
diagnostic_card_message   = "#c45a4f"

# The File view's structural chrome (GitHub issue #31's "editor chrome" checklist item) -
# selection, the current-line highlight, the caret, and a handful of tokens for editor features
# that are real schema slots but have **no real renderer yet** in this codebase
# (matching-bracket highlighting, indent guides inside the code surface itself - distinct from
# tree's file-*tree* indent guides, which are real and already painted -, whitespace marks, a
# minimap, blame text, and a removed-line gutter marker).
[editor]
selection           = "#3c71a9"  # The active text selection fill's base colour
selection_inactive  = "#3c71a9"
current_line        = "#181b1e"  # The current-line highlight
caret               = "#3c71a9"  # The caret bar
matching_bracket    = "#283a4c"  # A matched/matching bracket pair's highlight fill.
indent_guide        = "#1f2225"
indent_guide_active = "#364758"  # The indent guide for the level the caret currently sits in.
whitespace          = "#36393c"
minimap_bg          = "#141618"  # A minimap's own background fill.
gutter_text         = "#313437"  # The line-number gutter's text colour
gutter_text_active  = "#6a6e73"  # The current row's own brighter gutter-number colour
gutter_bg           = "#141618"  # The gutter column's own background fill.
blame_text          = "#54575c"  # Inline git-blame annotation text.
diff_added          = "#284b39"  # An added line's gutter marker
diff_removed        = "#784f4b"  # A removed line's own gutter marker.

# The terminal and agent CLI surface - prompt, output, its own status tones, and clickable path
# links.
[term]
prompt               = "#518bc7"
text                 = "#7b828b"
dim                  = "#54575c"
ok                   = "#4e8f62"
err                  = "#ba4136"
warn                 = "#a88735"
heading              = "#939ea9"
activity             = "#3c71a9"  # spinner / progress line
menu_sel_fg          = "#bd9138"
menu_sel_bg          = "#1e1a12"
cursor               = "#3c71a9"
link                 = "#4684c5"
link_underline       = "#36506b"
link_hover           = "#5c97d4"
link_underline_hover = "#4b7dad"

# Exact colours for Surface C's real Completions popup item rows - read directly from
# design_handoff_jerry_ade/revision/Jerry.dc.html's own completions/KBG/KFG data (the sel ? ...
[completions_popup]
item_selected_bg   = "#21313f"
item_selected_fg   = "#9eacbb"
item_fg            = "#858f99"
"kind_function.fg" = "#518bc7"
"kind_function.bg" = "#21313f"
"kind_variable.fg" = "#a88735"
"kind_variable.bg" = "#2c2511"
"kind_type.fg"     = "#9b58bf"
"kind_type.bg"     = "#2c1e33"


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Chrome and widgets
# ──────────────────────────────────────────────────────────────────────────────────────────────

# Buttons, by role: green (primary/confirm), blue (secondary), amber (attention) and the danger
