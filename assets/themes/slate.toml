[button]
green_bg        = "#213f32"
green_bg_hover  = "#284a3a"
green_fg        = "#64b987"
green_keycap    = "#30523f"
green_keycap_fg = "#5aa67c"
blue_bg         = "#21313f"
blue_bg_hover   = "#283a4c"
blue_fg         = "#5c97d4"
blue_keycap     = "#30465a"
amber_bg        = "#312715"
amber_bg_hover  = "#3b3019"
amber_fg        = "#bd9138"
danger_fg       = "#9c544c"
danger_fg_hover = "#c45a4f"

# Toggle switches and the Changes-panel staging checkbox.
[toggle]
track_on       = "#2a533e"
track_off      = "#202326"
knob_on        = "#7ec79d"
knob_off       = "#54575c"
checkbox_hover = "#365c46"

# Settings-surface-only colours read directly from Jerry.dc.html's inline literals for the
