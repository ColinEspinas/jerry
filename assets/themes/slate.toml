green_bg_hover  = "#134a35"
green_fg        = "#609b7d"
green_keycap    = "#1b5139"
green_keycap_fg = "#518f72"
blue_bg         = "#1c2f42"
blue_bg_hover   = "#203850"
blue_fg         = "#6e8dae"
blue_keycap     = "#26435f"
amber_bg        = "#2f240d"
amber_bg_hover  = "#3a2c0d"
amber_fg        = "#9e7b2d"
danger_fg       = "#934c43"
danger_fg_hover = "#a76056"

# Toggle switches and the Changes-panel staging checkbox.
[toggle]
track_on       = "#0f5338"
track_off      = "#1e2125"
knob_on        = "#82a392"
knob_off       = "#4d5258"
