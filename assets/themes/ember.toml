agent_not_found         = "#b636a5"  # A binary-not-found status dot on the Agents page
worktree_prunable_dot   = "#323a37"  # The Worktrees page's "merged and prunable" row dot
card_selected_bg        = "#151b18"
card_unselected_bg      = "#121715"
theme_card_hover_border = "#2f3834"
snippet_section         = "#5676bd"

# Palette-only (⌘P) colours read directly from Jerry.dc.html's inline literals for the
# paletteOpen block - real values missing from tokens.rs's transcription (predates the palette
