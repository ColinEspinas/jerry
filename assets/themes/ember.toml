# Ember - a bundled Jerry theme, and a worked example of the theme file format.
#
# GENERATED FILE. Every colour below was derived from Jerry Dark's own palette by the
# HSL transform in `crate::theme::derive_shift`, using this theme's five original
# swatches (#12100e, #1e1a16, #8fae6b, #d98b3a, #c4713f), then written out literally - so it renders
# exactly as this theme always has while being an ordinary, hand-editable theme file
# with no special status.
#
# Regenerate with `crate::settings::builtin_themes` - see that module's docs.
#
# Every key below is optional. Anything this file does not name is inherited from the theme in
# `base`, and ultimately from Jerry Dark's own built-in value - so deleting a line is a real,
# supported edit, and a file that sets three keys is a complete theme. New keys added by future
# Jerry versions simply inherit too; nothing here has to be kept exhaustive.

name = "Ember"
subtitle = "warm"
base = "Jerry Dark"

# The five swatches this theme's card shows on the Themes page.
preview = ["#12100e", "#1e1a16", "#8fae6b", "#d98b3a", "#c4713f"]


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Surfaces and structure
# ──────────────────────────────────────────────────────────────────────────────────────────────

# Backgrounds - every solid fill in the app, from the window itself down to popovers, hover
# states and keycaps.
[surface]
window                = "#0f1112"  # window body
window_border         = "#1f2427"
title_bar             = "#101314"
rail                  = "#101214"  # left rail + right panel
center                = "#121517"  # work surface
pty                   = "#0e1112"  # agent CLI + terminal
header                = "#111417"  # context bar, panel headers
footer                = "#111416"  # surface footers, status strips
card                  = "#14191b"  # composer, settings cards
card_sunk             = "#121618"  # card footers
popover               = "#151a1d"  # completion popup, hover card
palette               = "#131719"
scrim                 = "#090a0b"  # at 62% alpha behind the palette
row_hover             = "#131719"
row_hover_alt         = "#181c1e"  # hover on chrome buttons
row_selected          = "#171c1d"
segment_track         = "#15191b"
segment_active        = "#1d2528"
keycap                = "#151a1c"
keycap_hint           = "#141718"  # The hint-size keycap's own background
chip_neutral          = "#1d2225"
current_line          = "#151a1d"
title_bar_close_hover = "#ad004a"
menu_row_hover        = "#181f21"
tab_close_hover       = "#1d2325"  # A file tab's close-affordance hover fill

# The 1px rules that separate things - zone edges, card and popover outlines, and the
# selected-row edge.
[border]
zone            = "#1a1f20"  # between the three zones
inner           = "#181d1f"  # between bands inside a zone
rail_inner      = "#161a1c"
row             = "#15191a"  # change-list row separators
divider         = "#1c2124"  # 1px vertical rules
card            = "#1d2325"
card_field      = "#1c2225"
composer        = "#1d2427"
popover         = "#212a2e"
button          = "#21282b"  # outline button
button_disabled = "#1a1f22"
keycap          = "#1f2629"
keycap_hint     = "#1d2225"  # The hint-size keycap's own border
selected_edge   = "#224959"  # 2px left edge on a selected row
diagnostic_card = "#321c24"

# The Files tree's own structural marks (GitHub issue #18 §3).
[tree]
indent_guide        = "#1c2124"
indent_guide_active = "#224959"  # The guide for a level in the selected file's ancestor chain

# The overlay scrollbar's own colours (GitHub issue #30) - not from design_handoff_jerry_ade
# (that mockup has no scrollbar spec at all: every scrollable region there relies on raw,
# invisible browser/OS scrolling), so these are a deliberate, judgment-call derivation from
# existing neutral tokens rather than a transcription.
[scrollbar]
thumb       = "#2d3336"
thumb_hover = "#3f484d"


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Text
# ──────────────────────────────────────────────────────────────────────────────────────────────

# The interface text ramp, brightest to dimmest.
[text]
selected   = "#9da3a6"
primary    = "#969c9f"
heading    = "#8f9598"
strong     = "#8a9194"
body       = "#838c90"
secondary  = "#788186"
muted      = "#6e777b"
dim        = "#646c70"
dimmer     = "#5a6368"
faint      = "#4e565b"
fainter    = "#454d51"
ghost      = "#3a4246"
ghoster    = "#343c40"
hint       = "#32383b"
gutter     = "#2d3336"
disabled   = "#2e3539"
path       = "#373f44"
tree_caret = "#373f44"  # The file tree row's ▾/▸ caret


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Meaning and state (colour carries information here)
# ──────────────────────────────────────────────────────────────────────────────────────────────

# Status is the only place colour carries meaning in the rail.
[status]
ask           = "#bc6816"  # needs input
ask_bg        = "#362211"
fail          = "#af395c"
fail_bg       = "#321920"
review        = "#56863a"
review_bg     = "#1f3019"
run           = "#00789d"
run_bg        = "#122933"
idle          = "#3f484d"
idle_bg       = "#1c2124"
ask_card_bg   = "#1c1510"
ask_card_edge = "#774311"
ask_card_fg   = "#a66730"
banner_bg     = "#1b1510"
banner_border = "#2f2116"

# Diff and change colours - added/removed line fills and signs, hunk headers, and the
# change-list stat bars.
[diff]
add_bg     = "#141e14"
add_fg     = "#799771"
add_sign   = "#456838"
del_bg     = "#1e1419"
del_fg     = "#a1737d"
del_sign   = "#804151"
ctx_fg     = "#60696e"
hunk_bg    = "#13171a"
hunk_fg    = "#454f54"
fold_bg    = "#111417"
fold_fg    = "#373f44"
stat_add   = "#507344"  # "+142" label
stat_del   = "#894959"  # "-8" label
stat_empty = "#1c2124"  # unused segment of the 5-bar
git_gutter = "#2d4b22"  # 3px agent-touched marker

# Small status tags and the file tree's own A/M change marks.
[tag]
"new.fg"      = "#689057"
"new.bg"      = "#1f3019"
"deleted.fg"  = "#a0606f"
"deleted.bg"  = "#321920"
"conflict.fg" = "#b6773d"
"conflict.bg" = "#362211"
tree_added    = "#507344"  # "A" mark
tree_modified = "#8a5c21"  # "M" mark

# Tokens used only by the Revision R12 rail rewrite (design_handoff_jerry_ade/revision 3/
# REVISION-2026-07-31.md §2) that have no exact match elsewhere in this module - every other
# colour that section calls for (the branch/note/model/activity greys, the amber flag, the
# spine/selection edges) already has one, reused directly at the call site rather than
# duplicated here under a second name.
[rail]
repo_header_name   = "#576064"
worktree_active_bg = "#151a1c"
worktree_hover_bg  = "#14181a"  # Worktree row hover background (§2.2: "hover #16191c").
prunable_edge      = "#252c2f"

# One tint per agent.
[agent]
"sonnet.fg" = "#b36f25"
"sonnet.bg" = "#311f0c"
"codex.fg"  = "#5f863c"
"codex.bg"  = "#1e2a1a"
"haiku.fg"  = "#8d689f"
"haiku.bg"  = "#281c2f"
"local.fg"  = "#4277a3"
"local.bg"  = "#102538"


# ──────────────────────────────────────────────────────────────────────────────────────────────
# The code surface
# ──────────────────────────────────────────────────────────────────────────────────────────────

# The editor's per-scope syntax palette - one ColorToken per tree-sitter-highlight capture
# bucket crate::code_surface::code_view::HighlightKind classifies a token into.
[syntax]
text                      = "#7a838a"
keyword                   = "#8674b7"
function                  = "#2c87af"
function_method           = "#2c87af"
function_definition       = "#627dbd"  # function.definition
type                      = "#aa7337"
type_builtin              = "#aa7337"
constant                  = "#b7695c"
constant_builtin          = "#b7695c"
string                    = "#858231"
string_escape             = "#9c9948"  # string.escape
number                    = "#b7695c"
comment                   = "#758086"
comment_doc               = "#768086"  # comment.doc
variable                  = "#a56b9e"  # variable
variable_parameter        = "#b36785"
variable_builtin          = "#b7695c"  # variable.builtin (self/this/super/cls)
property                  = "#008c96"  # property (a field/attribute access
operator                  = "#5a646a"  # operator (+, ==, &&, ...)
punctuation_bracket       = "#5a646a"
punctuation_delimiter     = "#5a646a"  # punctuation.delimiter (,/;/:/./::)
bracket_1                 = "#875174"
bracket_2                 = "#8f533d"
bracket_3                 = "#6e631f"
bracket_4                 = "#286f4e"
bracket_5                 = "#156b83"
bracket_6                 = "#5b5e96"
tag                       = "#aa7337"
attribute                 = "#308e6d"
embedded                  = "#7a838a"
heading                   = "#aa7337"  # GitHub issue #104's own real, prose-specific buckets
link                      = "#2c87af"
strong                    = "#949ea5"  # text.strong (**bold**)
emphasis                  = "#8674b7"  # text.emphasis (*italic*)
caret                     = "#2488b0"
error_underline           = "#ca5976"  # 2px dotted
hover_underline           = "#4786a3"  # 1px solid
diagnostic_row_bg         = "#181417"
diagnostic_inline_message = "#af6b7a"
diagnostic_card_message   = "#c65c76"

# The File view's structural chrome (GitHub issue #31's "editor chrome" checklist item) -
# selection, the current-line highlight, the caret, and a handful of tokens for editor features
# that are real schema slots but have **no real renderer yet** in this codebase
# (matching-bracket highlighting, indent guides inside the code surface itself - distinct from
# tree's file-*tree* indent guides, which are real and already painted -, whitespace marks, a
# minimap, blame text, and a removed-line gutter marker).
[editor]
selection           = "#00789d"  # The active text selection fill's base colour
selection_inactive  = "#00789d"
current_line        = "#151a1d"  # The current-line highlight
caret               = "#00789d"  # The caret bar
matching_bracket    = "#123e4d"  # A matched/matching bracket pair's highlight fill.
indent_guide        = "#1c2124"
indent_guide_active = "#224959"  # The indent guide for the level the caret currently sits in.
whitespace          = "#32383b"
minimap_bg          = "#121517"  # A minimap's own background fill.
gutter_text         = "#2d3336"  # The line-number gutter's text colour
gutter_text_active  = "#646c70"  # The current row's own brighter gutter-number colour
gutter_bg           = "#121517"  # The gutter column's own background fill.
blame_text          = "#4e565b"  # Inline git-blame annotation text.
diff_added          = "#2d4b22"  # An added line's gutter marker
diff_removed        = "#804151"  # A removed line's own gutter marker.

# The terminal and agent CLI surface - prompt, output, its own status tones, and clickable path
# links.
[term]
prompt               = "#518fa8"
text                 = "#777f84"
dim                  = "#4e565b"
ok                   = "#5f863c"
err                  = "#af395c"
warn                 = "#b36f25"
heading              = "#929a9d"
activity             = "#00789d"  # spinner / progress line
menu_sel_fg          = "#b6773d"
menu_sel_bg          = "#1f170f"
cursor               = "#00789d"
link                 = "#3f89a7"
link_underline       = "#0a556e"
link_hover           = "#6599ae"
link_underline_hover = "#3f8099"

# Exact colours for Surface C's real Completions popup item rows - read directly from
# design_handoff_jerry_ade/revision/Jerry.dc.html's own completions/KBG/KFG data (the sel ? ...
[completions_popup]
item_selected_bg   = "#113340"
item_selected_fg   = "#a1a7aa"
item_fg            = "#838c90"
"kind_function.fg" = "#518fa8"
"kind_function.bg" = "#113340"
"kind_variable.fg" = "#b36f25"
"kind_variable.bg" = "#311f0c"
"kind_type.fg"     = "#7e6eba"
"kind_type.bg"     = "#251d3c"


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Chrome and widgets
# ──────────────────────────────────────────────────────────────────────────────────────────────

# Buttons, by role: green (primary/confirm), blue (secondary), amber (attention) and the danger
