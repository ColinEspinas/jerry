# Ember - a bundled Jerry theme, and a worked example of the theme file format.
#
# GENERATED FILE. Every colour below was derived from Jerry Dark's own palette by the
# HSL transform in `crate::theme::derive_shift`, using this theme's five original
# swatches (#12100e, #1e1a16, #8fae6b, #d98b3a, #c4713f), then written out literally - so it renders
# exactly as this theme always has while being an ordinary, hand-editable theme file
# with no special status.
#
# Regenerate with `crate::settings::builtin_themes` - see that module's docs.
#
# Every key below is optional. Anything this file does not name is inherited from the theme in
# `base`, and ultimately from Jerry Dark's own built-in value - so deleting a line is a real,
# supported edit, and a file that sets three keys is a complete theme. New keys added by future
# Jerry versions simply inherit too; nothing here has to be kept exhaustive.

name = "Ember"
subtitle = "warm"
base = "Jerry Dark"

# The five swatches this theme's card shows on the Themes page.
preview = ["#12100e", "#1e1a16", "#8fae6b", "#d98b3a", "#c4713f"]


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Surfaces and structure
# ──────────────────────────────────────────────────────────────────────────────────────────────

# Backgrounds - every solid fill in the app, from the window itself down to popovers, hover
# states and keycaps.
[surface]
window                     = "#0f1112"  # window body
window_border              = "#1f2427"
title_bar                  = "#101314"
rail                       = "#101214"  # left rail + right panel
sidebar_strip              = "#0c0e0f"  # The sidebar strip's own recessed band (GitHub issue #291)
center                     = "#121517"  # work surface
pty                        = "#0e1112"  # agent CLI + terminal
header                     = "#111417"  # context bar, panel headers
footer                     = "#111416"  # surface footers, status strips
card                       = "#14191b"  # composer, settings cards
card_sunk                  = "#121618"  # card footers
popover                    = "#151a1d"  # completion popup, hover card
palette                    = "#131719"
scrim                      = "#090a0b"  # at 62% alpha behind the palette
row_hover                  = "#131719"
row_hover_alt              = "#181c1e"  # hover on chrome buttons
row_selected               = "#171c1d"
segment_track              = "#15191b"
segment_active             = "#1d2528"
keycap                     = "#151a1c"
keycap_hint                = "#141718"  # The hint-size keycap's own background
chip_neutral               = "#1d2225"
current_line               = "#151a1d"
title_bar_close_hover      = "#ad004a"
menu_row_hover             = "#181f21"
menu_row_hover_destructive = "#26151c"
tab_close_hover            = "#1d2325"  # A file tab's close-affordance hover fill
lsp_popover_footer         = "#131718"
runs_well                  = "#0f1214"  # The Changes panel's Runs section

# The 1px rules that separate things - zone edges, card and popover outlines, and the
# selected-row edge.
[border]
zone                   = "#1a1f20"  # between the three zones
inner                  = "#181d1f"  # between bands inside a zone
rail_inner             = "#161a1c"
row                    = "#15191a"  # change-list row separators
divider                = "#1c2124"  # 1px vertical rules
card                   = "#1d2325"
card_field             = "#1c2225"
composer               = "#1d2427"
popover                = "#212a2e"
button                 = "#21282b"  # outline button
button_disabled        = "#1a1f22"
keycap                 = "#1f2629"
keycap_hint            = "#1d2225"  # The hint-size keycap's own border
selected_edge          = "#224959"  # 2px left edge on a selected row
diagnostic_card        = "#321c24"  # The Diagnostic popover's own border.
diagnostic_card_footer = "#251d22"  # The Diagnostic popover's own footer band's top border

# The Files tree's own structural marks (GitHub issue #18 §3).
[tree]
indent_guide        = "#1c2124"
indent_guide_active = "#224959"

# The overlay scrollbar (GitHub issue #30).
[scrollbar]
thumb       = "#222a2d"
thumb_hover = "#2e373c"


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Text
# ──────────────────────────────────────────────────────────────────────────────────────────────

# The interface text ramp, brightest to dimmest.
[text]
selected    = "#9da3a6"
primary     = "#969c9f"
heading     = "#8f9598"
strong      = "#8a9194"
body        = "#838c90"
secondary   = "#788186"
muted       = "#6e777b"
dim         = "#646c70"
dimmer      = "#5a6368"
faint       = "#4e565b"
fainter     = "#454d51"
ghost       = "#3a4246"
ghoster     = "#343c40"
hint        = "#32383b"
gutter      = "#2d3336"
disabled    = "#2e3539"
path        = "#373f44"
tree_caret  = "#373f44"  # The file tree row's ▾/▸ caret
glyph_hover = "#8e9699"


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Meaning and state (colour carries information here)
# ──────────────────────────────────────────────────────────────────────────────────────────────

# Status is the only place colour carries meaning in the rail.
[status]
ask           = "#bc6816"  # needs input
ask_bg        = "#362211"
fail          = "#af395c"
fail_bg       = "#321920"
review        = "#56863a"
review_bg     = "#1f3019"
run           = "#00789d"
run_bg        = "#122933"
idle          = "#3f484d"
idle_bg       = "#1c2124"
ask_card_bg   = "#1c1510"
ask_card_edge = "#774311"
ask_card_fg   = "#a66730"
banner_bg     = "#1b1510"
banner_border = "#2f2116"

# Diff and change colours - added/removed line fills and signs, hunk headers, and the
# change-list stat bars.
[diff]
add_bg     = "#141e14"
add_fg     = "#799771"
add_sign   = "#456838"
del_bg     = "#1e1419"
del_fg     = "#a1737d"
del_sign   = "#804151"
ctx_fg     = "#60696e"
hunk_bg    = "#13171a"
hunk_fg    = "#454f54"
fold_bg    = "#111417"
fold_fg    = "#373f44"
stat_add   = "#507344"  # "+142" label
stat_del   = "#894959"  # "-8" label
stat_empty = "#1c2124"  # unused segment of the 5-bar
git_gutter = "#2d4b22"  # 3px agent-touched marker

# Git's own A/M/D status letters on a file row, and the file tree's own A/M change marks.
[tag]
status_added    = "#507344"  # A - a file git reports as added (STAGE-A-CHANGELOG.md §4j).
status_modified = "#555e63"  # M - a file git reports as modified.
status_deleted  = "#894959"  # D
tree_added      = "#507344"  # "A" mark
tree_modified   = "#8a5c21"  # "M" mark

# Tokens the rail needs that have no exact match elsewhere in this module - every other colour
# it calls for (the branch/note/model/activity greys, the amber flag, the spine/selection edges)
# already has one, reused directly at the call site rather than duplicated here under a second
# name.
[rail]
repo_header_name   = "#6e777b"  # Repo group header's uppercase name.
worktree_active_bg = "#151a1c"
worktree_hover_bg  = "#14181a"  # Worktree row hover background (§2.2: "hover #16191c").
agent_title        = "#747c81"
repo_ask_count     = "#a66730"  # The repo header's amber urgency **count**
repo_fail_count    = "#984d60"  # The repo header's red urgency **count**

# One tint per agent - the **agent tint pool**.
[agent]
"sonnet.fg" = "#a65b49"  # Copper - sonnet-4.5.
"sonnet.bg" = "#2e1a0f"  # Copper - sonnet-4.5.
"codex.fg"  = "#368666"  # Teal - gpt-5-codex.
"codex.bg"  = "#11291f"  # Teal - gpt-5-codex.
"haiku.fg"  = "#606dab"  # Periwinkle - haiku-4.5.
"haiku.bg"  = "#1a1d30"  # Periwinkle - haiku-4.5.
"local.fg"  = "#4277a3"  # Steel blue - qwen-local.
"local.bg"  = "#102538"  # Steel blue - qwen-local.

# The Changes panel - four stacked, collapsible sections in one scroller, plus the file row's
# own seen/unseen and discard states.
[changes]
edge_uncommitted      = "#224959"  # UNCOMMITTED's 2px left edge - what is dirty in the checkout.
edge_neutral          = "#1c2124"  # COMMITS' 2px left edge.
edge_against_main     = "#8d689f"  # AGAINST MAIN's 2px left edge
section_label         = "#6e777b"  # Section header label - 9.5px/600 uppercase, .09em tracking.
section_count         = "#373f44"  # Section header count
section_caret         = "#646c70"  # The section header's own disclosure caret (▾/▸).
run_meta_live         = "#735230"
run_meta_ended        = "#454d51"  # A run row's meta line once the run has ended
section_stat_add      = "#689057"  # The right-aligned per-section diffstat's +N, 10px mono.
section_stat_del      = "#984d60"  # The right-aligned per-section diffstat's −N, 10px mono.
filename_unseen       = "#9da3a6"  # A filename not seen since the agent last changed it
filename_seen         = "#555e63"  # A filename seen since the agent last changed it
shared_ring           = "#774311"  # The ⚠ ring around a file row's author chips
hand_edit_gutter      = "#3a4246"  # The you gutter bar in the diff view
hand_edit_chip_fg     = "#646c70"
hand_edit_chip_bg     = "#1d2225"  # The you author chip's fill.
filter_bg             = "#181f21"
filter_hover_bg       = "#1d2528"  # FILTER_BG's hover fill
discard_bg            = "#26151c"  # The armed Discard? pill's fill.
discard_border        = "#3f1b25"  # The armed Discard? pill's 1px border.
discard_fg            = "#ac586d"  # The armed Discard? pill's label.
hover_action_hover_bg = "#1c2429"
discard_hover_bg      = "#2d151e"  # The discard button's hover fill

# Per-provider rate-limit budget - the meter on an agent tab and in the budget popover.
[budget]
ok       = "#689057"  # Above 40% remaining.
warn     = "#a66730"  # 15-40% remaining.
critical = "#984d60"  # Below 15% remaining.
track    = "#1c2124"  # The unfilled remainder of the meter
stale    = "#4e565b"

# Diff-line review notes (GitHub issue #288, STAGE-A-CHANGELOG.md §1's two §6.2 rows and the
# audit's top-5 #2) - the notes bar above the hunks and the card pinned beneath a line.
[notes]
edge             = "#00789d"
card_bg          = "#12191c"  # The pinned card's fill.
card_border      = "#1a333f"
card_fg          = "#8a9194"  # The card's own note text.
card_placeholder = "#454d51"  # The placeholder shown in an empty, still-being-typed card.
mark_draft       = "#488199"  # A card's draft mark
mark_sent        = "#689057"  # A card's sent mark, and the bar's own ✓ sent confirmation.
dot              = "#518fa8"
dot_empty        = "#2d3336"  # The same column's ○
bar_bg           = "#11191d"  # The notes bar's band.
bar_border       = "#152b35"  # Its 1px bottom rule against the hunks below it.
bar_label        = "#6599ae"  # The bar's count sentence (1 note on this file).
bar_meta         = "#454d51"
bar_error        = "#984d60"
send_bg          = "#112027"
send_border      = "#144a5c"  # Its 1px border, and its keycaps' border.
send_hover_bg    = "#132830"  # Its hover fill.
send_fg          = "#6599ae"  # Its label.
send_cap_fg      = "#488199"  # Its ⌘⏎ keycaps' glyphs.

# Agent history - the sidebar's run list and the run-transcript tab (GitHub issue #227).
[history]
out_done_fg        = "#689057"  # done - its last turn ended cleanly and Jerry watched it end.
out_done_bg        = "#172116"
out_interrupted_fg = "#a66730"  # interrupted
out_interrupted_bg = "#291d10"
out_failed_fg      = "#984d60"  # failed - its last real signal was a failure.
out_failed_bg      = "#26151c"
out_abandoned_fg   = "#646c70"  # abandoned - nobody ever saw it end.
out_abandoned_bg   = "#1a1f20"
drift_tip          = "#56863a"  # Drift dot, 0 commits since - at the tip.
drift_near         = "#518fa8"  # Drift dot, 1-2 commits since.
drift_far          = "#a66730"  # Drift dot, 3+ commits since.
drift_text         = "#454d51"
drift_far_text     = "#8a5c21"
scope_on_bg        = "#181f21"  # The scope toggle's selected segment
scope_on_border    = "#202a2e"
scope_on_fg        = "#8a9194"
scope_off_fg       = "#454d51"
scope_hover_bg     = "#181c1e"
repo_label         = "#6e777b"
group_label        = "#788186"
row_title          = "#8a9194"  # A run row's title when the row is not the open one.
transcript_prompt  = "#518fa8"  # The transcript body's four line tones
transcript_body    = "#777f84"
transcript_detail  = "#4e565b"
transcript_lead    = "#929a9d"
resume_bg          = "#1d2f19"  # The run-transcript footer's Resume here button
resume_bg_hover    = "#253f20"
resume_border      = "#345129"
resume_fg          = "#7b9f6f"

# The right panel's Search tab (GitHub issue #162, REVISION-2026-08-14.md §5 /
# STAGE-A-CHANGELOG.md §4v) - real hex values transcribed directly from those sections, not
# paraphrased.
[search]
modifier_on_bg = "#0f2c36"  # A modifier button's active fill
modifier_on_fg = "#6599ae"  # That button's glyph while it is on.
match_bg       = "#1a333f"
match_fg       = "#6599ae"  # The matched text itself.
line           = "#555e63"


# ──────────────────────────────────────────────────────────────────────────────────────────────
# The code surface
# ──────────────────────────────────────────────────────────────────────────────────────────────

# The editor's per-scope syntax palette - one ColorToken per tree-sitter-highlight capture
# bucket crate::code_surface::code_view::HighlightKind classifies a token into.
[syntax]
text                      = "#7a838a"
keyword                   = "#8674b7"
function                  = "#2c87af"
function_method           = "#2c87af"
function_definition       = "#627dbd"  # function.definition
type                      = "#aa7337"
type_builtin              = "#aa7337"
constant                  = "#b7695c"
constant_builtin          = "#b7695c"
string                    = "#858231"
string_escape             = "#9c9948"  # string.escape
number                    = "#b7695c"
comment                   = "#758086"
comment_doc               = "#768086"  # comment.doc
comment_doc_tag           = "#8674b7"  # GitHub issue #200's own doc-comment tag bucket
variable                  = "#a56b9e"  # variable
variable_parameter        = "#b36785"
variable_builtin          = "#b7695c"  # variable.builtin (self/this/super/cls)
property                  = "#008c96"  # property (a field/attribute access
operator                  = "#5a646a"  # operator (+, ==, &&, ...)
punctuation_bracket       = "#5a646a"
punctuation_delimiter     = "#5a646a"  # punctuation.delimiter (,/;/:/./::)
bracket_1                 = "#875174"
bracket_2                 = "#8f533d"
bracket_3                 = "#6e631f"
bracket_4                 = "#286f4e"
bracket_5                 = "#156b83"
bracket_6                 = "#5b5e96"
tag                       = "#aa7337"
attribute                 = "#308e6d"
embedded                  = "#7a838a"
heading                   = "#aa7337"  # GitHub issue #104's own real, prose-specific buckets
link                      = "#2c87af"
strong                    = "#949ea5"  # text.strong (**bold**)
emphasis                  = "#8674b7"  # text.emphasis (*italic*)
punctuation_special       = "#5a646a"
label                     = "#a56b9e"
string_special            = "#858231"
function_builtin          = "#2c87af"
function_macro            = "#2c87af"  # function.macro (Rust's println!-style macro invocations)
tag_error                 = "#aa7337"  # tag.error (HTML's mismatched/erroneous closing tag)
constructor               = "#aa7337"
caret                     = "#2488b0"
error_underline           = "#ca5976"  # 2px dotted
hover_underline           = "#4786a3"  # 1px solid
diagnostic_row_bg         = "#181417"
diagnostic_inline_message = "#af6b7a"
diagnostic_card_message   = "#b4687a"  # The Diagnostic state's card message headline.

# The File view's structural chrome (GitHub issue #31's "editor chrome" checklist item) -
# selection, the current-line highlight, the caret, and a handful of tokens for editor features
# that are real schema slots but have **no real renderer yet** in this codebase
# (matching-bracket highlighting, indent guides inside the code surface itself - distinct from
# tree's file-*tree* indent guides, which are real and already painted -, whitespace marks, a
# minimap, blame text, and a removed-line gutter marker).
[editor]
selection           = "#00789d"  # The active text selection fill's base colour
selection_inactive  = "#00789d"
current_line        = "#151a1d"  # The current-line highlight
caret               = "#00789d"  # The caret bar
matching_bracket    = "#123e4d"  # A matched/matching bracket pair's highlight fill.
indent_guide        = "#1c2124"
indent_guide_active = "#224959"  # The indent guide for the level the caret currently sits in.
whitespace          = "#32383b"
minimap_bg          = "#121517"  # A minimap's own background fill.
gutter_text         = "#2d3336"  # The line-number gutter's text colour
gutter_text_active  = "#646c70"  # The current row's own brighter gutter-number colour
gutter_bg           = "#121517"  # The gutter column's own background fill.
blame_text          = "#4e565b"  # Inline git-blame annotation text.
diff_added          = "#2d4b22"  # An added line's gutter marker
diff_removed        = "#804151"  # A removed line's own gutter marker.

# The terminal and agent CLI surface - prompt, output, its own status tones, and clickable path
# links.
[term]
