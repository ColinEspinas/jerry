green_fg        = "#7b9f6f"
green_keycap    = "#345129"
green_keycap_fg = "#6d9262"
blue_bg         = "#113340"
blue_bg_hover   = "#123e4d"
blue_fg         = "#6599ae"
blue_keycap     = "#144a5c"
amber_bg        = "#362211"
amber_bg_hover  = "#432912"
amber_fg        = "#b6773d"
danger_fg       = "#984d60"
danger_fg_hover = "#ad6275"

# Toggle switches and the Changes-panel staging checkbox.
[toggle]
track_on       = "#315324"
track_off      = "#1d2225"
knob_on        = "#93aa8e"
knob_off       = "#4e565b"
