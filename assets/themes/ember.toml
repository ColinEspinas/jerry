# The environment (WSL) chip's tokens - shown in the terminal footer, the status bar, and
# Settings' Default environment row.
[env]
wsl_fg       = "#518fa8"
wsl_bg       = "#102026"
wsl_border   = "#14303c"
local_fg     = "#4e565b"  # Defaults to text::FAINT's own value.
local_border = "#1c2124"  # Defaults to border::DIVIDER's own value.

# Language chips, shared by the file tree, the code tab and the palette.
[lang]
"rs.fg"      = "#9c5639"  # "rs"
"rs.bg"      = "#2b1b12"  # "rs"
"toml.fg"    = "#646c70"  # "to"
"toml.bg"    = "#1d2225"  # "to"
"md.fg"      = "#4277a3"  # "md"
"md.bg"      = "#14222c"  # "md"
"sql.fg"     = "#5f863c"  # "sq"
"sql.bg"     = "#1b2417"  # "sq"
"ts.fg"      = "#2b789d"  # "ts"
"ts.bg"      = "#102430"  # "ts"
"vue.fg"     = "#56863a"  # "vue"
"vue.bg"     = "#172116"  # "vue"
"py.fg"      = "#a97512"  # "py"
"py.bg"      = "#291f0e"  # "py"
"go.fg"      = "#29818b"  # "go"
"go.bg"      = "#0e2328"  # "go"
"json.fg"    = "#83898f"  # "jsn"
"json.bg"    = "#1e2125"  # "jsn"
"yaml.fg"    = "#537f9b"  # "yml"
"yaml.bg"    = "#142229"  # "yml"
"c.fg"       = "#616aa2"  # "c"
"c.bg"       = "#1a1d2d"  # "c"
"html.fg"    = "#a44a56"  # "htm"
"html.bg"    = "#2b1819"  # "htm"
"css.fg"     = "#8b5c97"  # "css"
"css.bg"     = "#241b28"  # "css"
"unknown.fg" = "#4e565b"
"unknown.bg" = "#1d2225"

# The status bar's three type tiers.
[status_bar]
primary       = "#788186"  # Tier 1
secondary     = "#5a6368"  # Tier 2
recessive     = "#373f44"  # Tier 3
divider       = "#222a2d"  # The 1px, 13-high rules between tiers.
section_label = "#434b4f"
meter_track   = "#1d2325"
load_neutral  = "#454d51"
load_elevated = "#a66730"  # 60% < load <= 85%.
load_critical = "#984d60"  # load > 85%.
