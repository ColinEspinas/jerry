# §2/§3, not paraphrased.
[graph]
tab_chip_bg             = "#312736"  # The tab chip's own background (§1: "#2a2030 bg").
tab_chip_fg             = "#c291b8"  # The tab chip's fork-glyph colour (§1: "#c98fbf fork glyph").
"lanes.0"               = "#7297c7"  # Six lane colours, cycled by lane % 6
"lanes.1"               = "#c291b8"  # Six lane colours, cycled by lane % 6
"lanes.2"               = "#64b083"  # Six lane colours, cycled by lane % 6
"lanes.3"               = "#cba855"  # Six lane colours, cycled by lane % 6
"lanes.4"               = "#b68654"  # Six lane colours, cycled by lane % 6
"lanes.5"               = "#9391cc"  # Six lane colours, cycled by lane % 6
"local_branch_dim_bg.0" = "#212d3a"
"local_branch_dim_bg.1" = "#312736"
"local_branch_dim_bg.2" = "#1d2e26"
"local_branch_dim_bg.3" = "#332c1a"
"local_branch_dim_bg.4" = "#32261a"
