# Jerry Dim - a bundled Jerry theme, and a worked example of the theme file format.
#
# GENERATED FILE. Every colour below was derived from Jerry Dark's own palette by the
# HSL transform in `crate::theme::derive_shift`, using this theme's five original
# swatches (#15181b, #20252a, #6ab97f, #d8a94a, #7f9ad4), then written out literally - so it renders
# exactly as this theme always has while being an ordinary, hand-editable theme file
# with no special status.
#
# Regenerate with `crate::settings::builtin_themes` - see that module's docs.
#
# Every key below is optional. Anything this file does not name is inherited from the theme in
# `base`, and ultimately from Jerry Dark's own built-in value - so deleting a line is a real,
# supported edit, and a file that sets three keys is a complete theme. New keys added by future
# Jerry versions simply inherit too; nothing here has to be kept exhaustive.

name = "Jerry Dim"
subtitle = "lower contrast"
base = "Jerry Dark"

# The five swatches this theme's card shows on the Themes page.
preview = ["#15181b", "#20252a", "#6ab97f", "#d8a94a", "#7f9ad4"]


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Surfaces and structure
# ──────────────────────────────────────────────────────────────────────────────────────────────

# Backgrounds - every solid fill in the app, from the window itself down to popovers, hover
# states and keycaps.
[surface]
window                = "#17181a"  # window body
window_border         = "#2c2f33"
title_bar             = "#191a1c"
rail                  = "#19191b"  # left rail + right panel
center                = "#1b1d20"  # work surface
pty                   = "#16181a"  # agent CLI + terminal
header                = "#1a1c1f"  # context bar, panel headers
footer                = "#1a1b1e"  # surface footers, status strips
card                  = "#1e2124"  # composer, settings cards
card_sunk             = "#1b1e21"  # card footers
popover               = "#202327"  # completion popup, hover card
palette               = "#1d2023"
scrim                 = "#0f1011"  # at 62% alpha behind the palette
row_hover             = "#1d2023"
row_hover_alt         = "#222629"  # hover on chrome buttons
row_selected          = "#222528"
segment_track         = "#1f2124"
segment_active        = "#2a2f34"
keycap                = "#202326"
keycap_hint           = "#1d2022"  # The hint-size keycap's own background
chip_neutral          = "#292d31"
current_line          = "#202327"
title_bar_close_hover = "#d62807"
menu_row_hover        = "#24282c"
tab_close_hover       = "#292e32"  # A file tab's close-affordance hover fill

# The 1px rules that separate things - zone edges, card and popover outlines, and the
# selected-row edge.
[border]
zone            = "#25282b"  # between the three zones
inner           = "#23272a"  # between bands inside a zone
rail_inner      = "#212326"
row             = "#1f2123"  # change-list row separators
divider         = "#292c30"  # 1px vertical rules
card            = "#292e32"
card_field      = "#292d31"
composer        = "#2a2e33"
popover         = "#30363c"
button          = "#303438"  # outline button
button_disabled = "#26292d"
keycap          = "#2d3136"
keycap_hint     = "#292d31"  # The hint-size keycap's own border
selected_edge   = "#435971"  # 2px left edge on a selected row

# The Files tree's own structural marks (GitHub issue #18 §3).
[tree]
indent_guide        = "#292c30"
indent_guide_active = "#435971"  # The guide for a level in the selected file's ancestor chain

# The overlay scrollbar's own colours (GitHub issue #30) - not from design_handoff_jerry_ade
# (that mockup has no scrollbar spec at all: every scrollable region there relies on raw,
# invisible browser/OS scrolling), so these are a deliberate, judgment-call derivation from
# existing neutral tokens rather than a transcription.
[scrollbar]
thumb       = "#3d4146"
thumb_hover = "#555b62"


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Text
# ──────────────────────────────────────────────────────────────────────────────────────────────

# The interface text ramp, brightest to dimmest.
[text]
selected   = "#c7cacf"
primary    = "#bec2c7"
heading    = "#b5b9be"
strong     = "#b0b4b9"
body       = "#a8adb4"
secondary  = "#9ba1a7"
muted      = "#8f949b"
dim        = "#82878c"
dimmer     = "#767c82"
faint      = "#676c72"
fainter    = "#5c6166"
ghost      = "#4e5359"
ghoster    = "#474c51"
hint       = "#43474c"
gutter     = "#3d4146"
disabled   = "#40444a"
path       = "#4b5056"
tree_caret = "#4b5056"  # The file tree row's ▾/▸ caret


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Meaning and state (colour carries information here)
# ──────────────────────────────────────────────────────────────────────────────────────────────

# Status is the only place colour carries meaning in the rail.
[status]
ask           = "#c89935"  # needs input
ask_bg        = "#3c321c"
fail          = "#cd604e"
fail_bg       = "#3f2522"
review        = "#4faa7e"
review_bg     = "#223f31"
run           = "#5e8dc4"
run_bg        = "#263342"
idle          = "#555b62"
idle_bg       = "#292c30"
ask_card_bg   = "#231f18"
ask_card_edge = "#7f6325"
ask_card_fg   = "#b3914a"
banner_bg     = "#221e18"
banner_border = "#372f21"

# Diff and change colours - added/removed line fills and signs, hunk headers, and the
# change-list stat bars.
[diff]
add_bg     = "#192822"
add_fg     = "#8ebda6"
add_sign   = "#488468"
del_bg     = "#281d1e"
del_fg     = "#c2978f"
del_sign   = "#985d53"
ctx_fg     = "#7e838a"
hunk_bg    = "#1d2023"
hunk_fg    = "#5d626a"
fold_bg    = "#1a1c1f"
fold_fg    = "#4b5056"
stat_add   = "#569176"  # "+142" label
stat_del   = "#a3665c"  # "-8" label
stat_empty = "#292c30"  # unused segment of the 5-bar
git_gutter = "#2c6049"  # 3px agent-touched marker

# Small status tags and the file tree's own A/M change marks.
[tag]
"new.fg"      = "#70b693"
"new.bg"      = "#223f31"
"deleted.fg"  = "#bf8278"
"deleted.bg"  = "#3f2522"
"conflict.fg" = "#c6a55c"
"conflict.bg" = "#3c321c"
tree_added    = "#569176"  # "A" mark
tree_modified = "#938040"  # "M" mark

# Tokens used only by the Revision R12 rail rewrite (design_handoff_jerry_ade/revision 3/
# REVISION-2026-07-31.md §2) that have no exact match elsewhere in this module - every other
# colour that section calls for (the branch/note/model/activity greys, the amber flag, the
# spine/selection edges) already has one, reused directly at the call site rather than
# duplicated here under a second name.
[rail]
repo_header_name   = "#72777e"
worktree_active_bg = "#202326"
worktree_hover_bg  = "#1e2023"  # Worktree row hover background (§2.2: "hover #16191c").
prunable_edge      = "#34393e"

# One tint per agent.
[agent]
"sonnet.fg" = "#bf9d47"
"sonnet.bg" = "#362e18"
"codex.fg"  = "#5caa7d"
"codex.bg"  = "#23382e"
"haiku.fg"  = "#bb83aa"
"haiku.bg"  = "#392633"
"local.fg"  = "#7c8dc2"
"local.bg"  = "#282e45"


# ──────────────────────────────────────────────────────────────────────────────────────────────
# The code surface
# ──────────────────────────────────────────────────────────────────────────────────────────────

# The editor's per-scope syntax palette - one ColorToken per tree-sitter-highlight capture
# bucket crate::code_surface::code_view::HighlightKind classifies a token into.
[syntax]
text                      = "#9ea2ab"
keyword                   = "#b587bf"
function                  = "#739dd4"
function_method           = "#739dd4"
function_definition       = "#9a90d1"  # function.definition
type                      = "#b19852"
type_builtin              = "#b19852"
constant                  = "#c88a60"
constant_builtin          = "#c88a60"
string                    = "#85a669"
string_escape             = "#a4c787"  # string.escape
number                    = "#c88a60"
comment                   = "#7f858d"
comment_doc               = "#838891"  # comment.doc
variable                  = "#c9829d"  # variable
variable_parameter        = "#ce8281"
variable_builtin          = "#c88a60"  # variable.builtin (self/this/super/cls)
property                  = "#54a6c9"  # property (a field/attribute access
operator                  = "#6b6f77"  # operator (+, ==, &&, ...)
punctuation_bracket       = "#6b6f77"
punctuation_delimiter     = "#6b6f77"  # punctuation.delimiter (,/;/:/./::)
bracket_1                 = "#965a68"
bracket_2                 = "#8f6539"
bracket_3                 = "#647741"
bracket_4                 = "#297e75"
bracket_5                 = "#44739b"
bracket_6                 = "#7b6295"
tag                       = "#b19852"
attribute                 = "#47ada8"
embedded                  = "#9ea2ab"
heading                   = "#b19852"  # GitHub issue #104's own real, prose-specific buckets
link                      = "#739dd4"
strong                    = "#bfc4cd"  # text.strong (**bold**)
emphasis                  = "#b587bf"  # text.emphasis (*italic*)
punctuation_special       = "#6b6f77"
label                     = "#c9829d"
string_special            = "#85a669"
function_builtin          = "#739dd4"
function_macro            = "#739dd4"  # function.macro (Rust's println!-style macro invocations)
tag_error                 = "#b19852"  # tag.error (HTML's mismatched/erroneous closing tag)
constructor               = "#b19852"
caret                     = "#558acd"
error_underline           = "#ce6655"  # 2px dotted
hover_underline           = "#6787b0"  # 1px solid
diagnostic_row_bg         = "#211c1d"
diagnostic_inline_message = "#b3746a"
diagnostic_card_message   = "#da7867"

# The File view's structural chrome (GitHub issue #31's "editor chrome" checklist item) -
# selection, the current-line highlight, the caret, and a handful of tokens for editor features
# that are real schema slots but have **no real renderer yet** in this codebase
# (matching-bracket highlighting, indent guides inside the code surface itself - distinct from
# tree's file-*tree* indent guides, which are real and already painted -, whitespace marks, a
# minimap, blame text, and a removed-line gutter marker).
[editor]
selection           = "#5e8dc4"  # The active text selection fill's base colour
selection_inactive  = "#5e8dc4"
current_line        = "#202327"  # The current-line highlight
caret               = "#5e8dc4"  # The caret bar
matching_bracket    = "#334a63"  # A matched/matching bracket pair's highlight fill.
indent_guide        = "#292c30"
indent_guide_active = "#435971"  # The indent guide for the level the caret currently sits in.
whitespace          = "#43474c"
minimap_bg          = "#1b1d20"  # A minimap's own background fill.
gutter_text         = "#3d4146"  # The line-number gutter's text colour
gutter_text_active  = "#82878c"  # The current row's own brighter gutter-number colour
gutter_bg           = "#1b1d20"  # The gutter column's own background fill.
blame_text          = "#676c72"  # Inline git-blame annotation text.
diff_added          = "#2c6049"  # An added line's gutter marker
diff_removed        = "#985d53"  # A removed line's own gutter marker.

# The terminal and agent CLI surface - prompt, output, its own status tones, and clickable path
# links.
[term]
prompt               = "#88abd2"
text                 = "#9a9ea5"
dim                  = "#676c72"
ok                   = "#5caa7d"
err                  = "#cd604e"
warn                 = "#bf9d47"
heading              = "#babfc4"
activity             = "#5e8dc4"  # spinner / progress line
menu_sel_fg          = "#c6a55c"
menu_sel_bg          = "#252218"
cursor               = "#5e8dc4"
link                 = "#7ba3d0"
link_underline       = "#43658a"
link_hover           = "#99b8d9"
link_underline_hover = "#7499bf"

# Exact colours for Surface C's real Completions popup item rows - read directly from
# design_handoff_jerry_ade/revision/Jerry.dc.html's own completions/KBG/KFG data (the sel ? ...
[completions_popup]
item_selected_bg   = "#2c3e52"
item_selected_fg   = "#cccfd4"
item_fg            = "#a8adb4"
"kind_function.fg" = "#88abd2"
"kind_function.bg" = "#2c3e52"
"kind_variable.fg" = "#bf9d47"
"kind_variable.bg" = "#362e18"
"kind_type.fg"     = "#b687c7"
"kind_type.bg"     = "#3a2640"


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Chrome and widgets
# ──────────────────────────────────────────────────────────────────────────────────────────────

# Buttons, by role: green (primary/confirm), blue (secondary), amber (attention) and the danger
# red.
[button]
