tag_chip_bg             = "#332c1a"  # A tag chip (§2: "tag #2b2413/#d8a94a").
tag_chip_fg             = "#cba855"
head_ring               = "#6395c9"  # The HEAD dot's ring colour (§2: "a 2px #5a9ad4 ring").
working_tree_border     = "#6e7278"
header_bg               = "#181b1e"  # The column header band's own background (§6.1: "#101315")
header_label_fg         = "#4f545a"  # The column header labels' colour (§6.1: "#4a5057
behind_warn             = "#9c8849"
branch_no_lane_dot      = "#42474c"

# The environment (WSL) chip's tokens - shown in the terminal footer, the status bar, and
# Settings' Default environment row.
[env]
wsl_fg       = "#91b7dd"
wsl_bg       = "#1d2933"
wsl_border   = "#2b3c4e"
local_fg     = "#6e7278"  # Defaults to text::FAINT's own value.
local_border = "#292d31"  # Defaults to border::DIVIDER's own value.

# Language chips, shared by the file tree, the code tab and the palette.
[lang]
