# Jerry Dim - a bundled Jerry theme, and a worked example of the theme file format.
#
# GENERATED FILE. Every colour below was derived from Jerry Dark's own palette by the
# HSL transform in `crate::theme::derive_shift`, using this theme's five original
# swatches (#15181b, #20252a, #6ab97f, #d8a94a, #7f9ad4), then written out literally - so it renders
# exactly as this theme always has while being an ordinary, hand-editable theme file
# with no special status.
#
# Regenerate with `crate::settings::builtin_themes` - see that module's docs.
#
# Every key below is optional. Anything this file does not name is inherited from the theme in
# `base`, and ultimately from Jerry Dark's own built-in value - so deleting a line is a real,
# supported edit, and a file that sets three keys is a complete theme. New keys added by future
# Jerry versions simply inherit too; nothing here has to be kept exhaustive.

name = "Jerry Dim"
subtitle = "lower contrast"
base = "Jerry Dark"

# The five swatches this theme's card shows on the Themes page.
preview = ["#15181b", "#20252a", "#6ab97f", "#d8a94a", "#7f9ad4"]


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Surfaces and structure
# ──────────────────────────────────────────────────────────────────────────────────────────────

# Backgrounds - every solid fill in the app, from the window itself down to popovers, hover
# states and keycaps.
[surface]
window                = "#16171a"  # window body
window_border         = "#2d3034"
title_bar             = "#181a1d"
rail                  = "#18191c"  # left rail + right panel
center                = "#1b1d20"  # work surface
pty                   = "#15171a"  # agent CLI + terminal
header                = "#1a1c20"  # context bar, panel headers
footer                = "#191b1f"  # surface footers, status strips
card                  = "#1e2225"  # composer, settings cards
card_sunk             = "#1b1e21"  # card footers
popover               = "#1f2328"  # completion popup, hover card
palette               = "#1d2023"
scrim                 = "#0e1012"  # at 62% alpha behind the palette
row_hover             = "#1d2023"
row_hover_alt         = "#22262a"  # hover on chrome buttons
row_selected          = "#212529"
segment_track         = "#1f2225"
segment_active        = "#2b3035"
keycap                = "#1f2327"
keycap_hint           = "#1d2022"  # The hint-size keycap's own background
chip_neutral          = "#2a2e32"
current_line          = "#1f2328"
title_bar_close_hover = "#d6242d"
menu_row_hover        = "#24292d"
tab_close_hover       = "#2a2e33"  # A file tab's close-affordance hover fill

# The 1px rules that separate things - zone edges, card and popover outlines, and the
# selected-row edge.
[border]
zone            = "#25292c"  # between the three zones
inner           = "#23272a"  # between bands inside a zone
rail_inner      = "#202327"
row             = "#1f2224"  # change-list row separators
divider         = "#292d31"  # 1px vertical rules
card            = "#2a2e33"
card_field      = "#292e32"
composer        = "#2b2f34"
popover         = "#32383e"
button          = "#31353a"  # outline button
button_disabled = "#262a2e"
keycap          = "#2e3237"
keycap_hint     = "#2a2e32"  # The hint-size keycap's own border
selected_edge   = "#465d73"  # 2px left edge on a selected row

# The Files tree's own structural marks (GitHub issue #18 §3).
[tree]
indent_guide        = "#292d31"
indent_guide_active = "#465d73"  # The guide for a level in the selected file's ancestor chain

# The overlay scrollbar's own colours (GitHub issue #30) - not from design_handoff_jerry_ade
# (that mockup has no scrollbar spec at all: every scrollable region there relies on raw,
# invisible browser/OS scrolling), so these are a deliberate, judgment-call derivation from
# existing neutral tokens rather than a transcription.
[scrollbar]
thumb       = "#404449"
thumb_hover = "#5a6066"


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Text
# ──────────────────────────────────────────────────────────────────────────────────────────────

# The interface text ramp, brightest to dimmest.
[text]
selected   = "#d6dbe1"
primary    = "#cdd2d7"
heading    = "#c3c8cd"
strong     = "#bec2c7"
body       = "#b5bbc1"
secondary  = "#a7adb3"
muted      = "#999fa5"
dim        = "#8b9095"
dimmer     = "#7e848a"
faint      = "#6e7278"
fainter    = "#61666c"
ghost      = "#52575d"
ghoster    = "#4a4f54"
hint       = "#464a4f"
gutter     = "#404449"
disabled   = "#42474c"
path       = "#4f545a"
tree_caret = "#4f545a"  # The file tree row's ▾/▸ caret


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Meaning and state (colour carries information here)
# ──────────────────────────────────────────────────────────────────────────────────────────────

# Status is the only place colour carries meaning in the rail.
[status]
ask           = "#d3a344"  # needs input
ask_bg        = "#40341b"
fail          = "#d46d65"
fail_bg       = "#402625"
review        = "#64b083"
review_bg     = "#254131"
run           = "#6395c9"
run_bg        = "#253443"
idle          = "#5a6066"
idle_bg       = "#292d31"
ask_card_bg   = "#252017"
ask_card_edge = "#86682b"
ask_card_fg   = "#be9b58"
banner_bg     = "#241f17"
banner_border = "#3a3121"

# Diff and change colours - added/removed line fills and signs, hunk headers, and the
# change-list stat bars.
[diff]
add_bg     = "#192922"
add_fg     = "#9fc9b1"
add_sign   = "#55896c"
del_bg     = "#291c1e"
del_fg     = "#cfa5a0"
del_sign   = "#9d6762"
ctx_fg     = "#878c92"
hunk_bg    = "#1d2024"
hunk_fg    = "#62686f"
fold_bg    = "#1a1c20"
fold_fg    = "#4f545a"
stat_add   = "#65977b"  # "+142" label
stat_del   = "#a9716c"  # "-8" label
stat_empty = "#292d31"  # unused segment of the 5-bar
git_gutter = "#34634a"  # 3px agent-touched marker

# Small status tags and the file tree's own A/M change marks.
[tag]
"new.fg"      = "#83bf9b"
"new.bg"      = "#254131"
"deleted.fg"  = "#c98f89"
"deleted.bg"  = "#402625"
"conflict.fg" = "#d4b16b"
"conflict.bg" = "#40341b"
tree_added    = "#65977b"  # "A" mark
tree_modified = "#9c8849"  # "M" mark

# Tokens used only by the Revision R12 rail rewrite (design_handoff_jerry_ade/revision 3/
# REVISION-2026-07-31.md §2) that have no exact match elsewhere in this module - every other
# colour that section calls for (the branch/note/model/activity greys, the amber flag, the
# spine/selection edges) already has one, reused directly at the call site rather than
# duplicated here under a second name.
[rail]
repo_header_name   = "#7a7f85"
worktree_active_bg = "#1f2327"
worktree_hover_bg  = "#1e2124"  # Worktree row hover background (§2.2: "hover #16191c").
prunable_edge      = "#353a3f"

# One tint per agent.
[agent]
"sonnet.fg" = "#cba855"
"sonnet.bg" = "#3a3016"
"codex.fg"  = "#70b283"
"codex.bg"  = "#25392e"
"haiku.fg"  = "#c291b8"
"haiku.bg"  = "#392736"
"local.fg"  = "#8398cb"
"local.bg"  = "#262f46"


# ──────────────────────────────────────────────────────────────────────────────────────────────
# The code surface
# ──────────────────────────────────────────────────────────────────────────────────────────────

# The editor's per-scope syntax palette - one ColorToken per tree-sitter-highlight capture
# bucket crate::code_surface::code_view::HighlightKind classifies a token into.
[syntax]
text                      = "#aaafb9"
keyword                   = "#b27cc6"
function                  = "#7aa7dd"
function_method           = "#7aa7dd"
type                      = "#d5be87"
type_builtin              = "#d5be87"
constant                  = "#b79670"
constant_builtin          = "#b79670"
string                    = "#99b474"
string_escape             = "#bcd19b"  # string.escape
number                    = "#b79670"
comment                   = "#616570"
comment_doc               = "#7e828e"  # comment.doc
variable                  = "#b78ba1"  # variable
variable_parameter        = "#b45f70"
variable_builtin          = "#b79670"  # variable.builtin (self/this/super/cls)
property                  = "#7aabbf"  # property (a field/attribute access
operator                  = "#aaafb9"  # operator (+, ==, &&, ...)
punctuation_bracket       = "#aaafb9"
punctuation_delimiter     = "#aaafb9"  # punctuation.delimiter (,/;/:/./::)
tag                       = "#d5be87"
attribute                 = "#82b2ad"
embedded                  = "#aaafb9"
heading                   = "#d5be87"  # GitHub issue #104's own real, prose-specific buckets
link                      = "#7aa7dd"
strong                    = "#ced3de"  # text.strong (**bold**)
emphasis                  = "#c5a7d2"  # text.emphasis (*italic*)
caret                     = "#6395c9"
error_underline           = "#d46d65"  # 2px dotted
hover_underline           = "#5679a1"  # 1px solid
diagnostic_row_bg         = "#211c1e"
diagnostic_inline_message = "#6c504e"
diagnostic_card_message   = "#da948d"

# The File view's structural chrome (GitHub issue #31's "editor chrome" checklist item) -
# selection, the current-line highlight, the caret, and a handful of tokens for editor features
# that are real schema slots but have **no real renderer yet** in this codebase
# (matching-bracket highlighting, indent guides inside the code surface itself - distinct from
# tree's file-*tree* indent guides, which are real and already painted -, whitespace marks, a
# minimap, blame text, and a removed-line gutter marker).
[editor]
selection           = "#6395c9"  # The active text selection fill's base colour
selection_inactive  = "#6395c9"
current_line        = "#1f2328"  # The current-line highlight
caret               = "#6395c9"  # The caret bar
matching_bracket    = "#344d64"  # A matched/matching bracket pair's highlight fill.
indent_guide        = "#292d31"  # A resting indent guide inside the code surface.
indent_guide_active = "#465d73"  # The indent guide for the level the caret currently sits in.
whitespace          = "#464a4f"
minimap_bg          = "#1b1d20"  # A minimap's own background fill.
gutter_text         = "#404449"  # The line-number gutter's text colour
gutter_text_active  = "#8b9095"  # The current row's own brighter gutter-number colour
gutter_bg           = "#1b1d20"  # The gutter column's own background fill.
blame_text          = "#6e7278"  # Inline git-blame annotation text.
diff_added          = "#34634a"  # An added line's gutter marker
diff_removed        = "#9d6762"  # A removed line's own gutter marker.

# The terminal and agent CLI surface - prompt, output, its own status tones, and clickable path
# links.
[term]
prompt               = "#91b7dd"
text                 = "#a5aab0"
dim                  = "#6e7278"
ok                   = "#70b283"
err                  = "#d46d65"
warn                 = "#cba855"
heading              = "#c9ced4"
activity             = "#6395c9"  # spinner / progress line
menu_sel_fg          = "#d4b16b"
menu_sel_bg          = "#282317"
cursor               = "#6395c9"
link                 = "#83aed9"
link_underline       = "#466a8d"
link_hover           = "#a4c6e7"
link_underline_hover = "#7da3c7"

# Exact colours for Surface C's real Completions popup item rows - read directly from
# design_handoff_jerry_ade/revision/Jerry.dc.html's own completions/KBG/KFG data (the sel ? ...
[completions_popup]
item_selected_bg   = "#2c4053"
item_selected_fg   = "#dce1e6"
item_fg            = "#b5bbc1"
"kind_function.fg" = "#91b7dd"
"kind_function.bg" = "#2c4053"
"kind_variable.fg" = "#cba855"
"kind_variable.bg" = "#3a3016"
"kind_type.fg"     = "#bf95d7"
"kind_type.bg"     = "#3a2743"


# ──────────────────────────────────────────────────────────────────────────────────────────────
# Chrome and widgets
# ──────────────────────────────────────────────────────────────────────────────────────────────

# Buttons, by role: green (primary/confirm), blue (secondary), amber (attention) and the danger
# red.
[button]
green_bg        = "#2c5341"
green_bg_hover  = "#34614b"
green_fg        = "#9fd4b5"
green_keycap    = "#3e6b53"
green_keycap_fg = "#8cc2a4"
blue_bg         = "#2c4053"
blue_bg_hover   = "#344d64"
blue_fg         = "#a4c6e7"
blue_keycap     = "#3e5c77"
amber_bg        = "#40341b"
amber_bg_hover  = "#4e3f20"
amber_fg        = "#d4b16b"
danger_fg       = "#bc7973"
danger_fg_hover = "#da948d"

# Toggle switches and the Changes-panel staging checkbox.
[toggle]
track_on       = "#376d51"
track_off      = "#2a2e32"
knob_on        = "#c3e5d1"
knob_off       = "#6e7278"
checkbox_hover = "#46795b"

# Settings-surface-only colours read directly from Jerry.dc.html's inline literals for the
# settingsOpen block - real values present in the mockup but missing from tokens.rs's
# transcription (predates the Settings section).
[settings]
nav_row_hover           = "#1f2123"
subtitle                = "#787d83"
card_row_sep            = "#262a2e"
agent_ready             = "#64b083"  # A binary-found status dot on the Agents page.
agent_not_found         = "#d46d65"  # A binary-not-found status dot on the Agents page
worktree_prunable_dot   = "#44494f"  # The Worktrees page's "merged and prunable" row dot
card_selected_bg        = "#1d2227"
card_unselected_bg      = "#1b1e21"
theme_card_hover_border = "#40464c"
snippet_section         = "#bf95d7"

# Palette-only (⌘P) colours read directly from Jerry.dc.html's inline literals for the
# paletteOpen block - real values missing from tokens.rs's transcription (predates the palette
# section).
[palette]
prefix            = "#657e99"
group_header      = "#5f6369"
row_hover         = "#202428"
label_selected    = "#dce1e6"
"command_chip.fg" = "#8398cb"
"command_chip.bg" = "#242b38"

# The git graph tab (design handoff design_handoff_jerry_ade/revision 2/CHANGELOG.md, 2026-07-31
