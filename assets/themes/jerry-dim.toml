"lanes.2"               = "#4faa7e"  # Six lane colours, cycled by lane % 6
"lanes.3"               = "#bf9d47"  # Six lane colours, cycled by lane % 6
"lanes.4"               = "#ae7c45"  # Six lane colours, cycled by lane % 6
